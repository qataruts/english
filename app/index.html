<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <!-- **قرصةُ الطفل حرة** (بلاغُ ميدانٍ ناقض من اقرأ — `read@7f18bf0`): كان قفلُ
       المقياس علاجاً لاسترجاع iPadOS المكبَّر، **فنقضه بلاغُ الميدان**: الطفل كان
       يكبّر الصفحة بالقرصة ليرى جيداً («أمرٌ مريح وتلقائي») والقفلُ حرمه إياها —
       تحويطٌ أوسعُ من عيبه. يبقى من العلاج: العودةُ من الخلفية تُرجِع المقياسَ ١
       برمجياً (`main.js`)، وتكبيرُ النقر المزدوج العارض ساقطٌ باللوح
       (`touch-action: manipulation`) والقرصةُ المتعمَّدة لا يمسّها. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- **الاسمان معاً** (أحكامُ الهوية، ١٦ أغسطس ٢٠٢٦ · `docs/REVIEW_IDENTITY.md`):
       الاسمُ العربيُّ «اِسْمَعْ» هو الاسمُ في كل نصٍّ عربيّ، والعلامةُ المرسومة
       `Listen!` تُرسَم في الترويسة وعلى الأيقونة — وهذه صفحةُ نصٍّ ووسومٍ يقرؤها
       الجهاز، فيُكتب فيها الاسمُ ومعه علامتُه كما تُقرأ على الشاشة. -->
  <meta name="description" content="«اِسْمَعْ» (Listen!) — تأسيسُ الإنكليزية لطفلٍ عربيّ في السادسة: السمعُ قبل الحرف، ولا يقرأ إلا ما أتقن سمعَه">
  <meta name="theme-color" content="#FBF5EF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2A2026">
  <!-- **والوسمان معاً لا أحدُهما** (عيبٌ مقيسٌ في الجلسة ٠): كروم يطبع تحذيرَ
       إهمالٍ في الطرفية على `apple-*` وحدَه، وهو **المعروضُ الوحيد في سجلّ الوحدة**
       على بذرةٍ سليمة — فيصير سطرُ ضجيجٍ يُقرأ سريعاً فوق أول عطبٍ حقيقيّ. و`apple-*`
       لا يُحذَف: سفاري وحدَه يقرؤه، وiPadOS جهازُ هذا الطفل. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- واسمُ الأيقونة على شاشة الجهاز اسمٌ **نصّيّ** لا علامة مرسومة: فهو «اِسْمَعْ»،
       والعلامةُ `Listen!` مرسومةٌ في الأيقونة فوقه — وهي الثنائيةُ بعينها. -->
  <meta name="apple-mobile-web-app-title" content="اِسْمَعْ">
  <title>اِسْمَعْ (Listen!) — تأسيسُ الإنكليزية لطفلٍ عربيّ</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <p class="boot">يُحمَّل التطبيق…</p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p class="boot">هذا التطبيق يحتاج تفعيل جافاسكربت في المتصفّح.</p>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>

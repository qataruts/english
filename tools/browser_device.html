<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تطبيق الإنكليزية على مقاسات الآيباد</title>
<style>html,body{margin:0;height:100%}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="/"></iframe>
<script type="module">
  /* صفحةُ الجهاز: التطبيقُ يملأ المنظور بمقاس الآيباد الذي فُتحت به النافذة،
     فيُقاس **الفائضُ الأفقيّ** حيث يقع فعلاً — لا في إطارٍ ذي مقاسٍ آخر.
     و«بلا فائض أفقي» عهدٌ مطلق (`METHOD.md §١٠.٧`): طفلُ الرابعة لا يسحب ليجد زرّاً. */
  const frame = document.getElementById('app');

  /* **وتُقاس شاشاتُ التطبيق لا الخريطةُ وحدَها**: أوسعُ ما فيه اليوم لوحةُ الوالد
     (بطاقاتُ الوحدات صفّان وقوائمُ التحكّم)، ثم شاشاتُ المحطات بأشكالها.
     **ويُبلَّغ أسوأُ ما قِيس لا آخرُه**.

     **وشاشةُ المحطة تُقاس في خطوة «شاهِدْ»** — وهي ما يظهر بلا قيادة: صفوفُ الاختيار
     خلفها تلفّ بطبعها (`flex-wrap`)، فالفائضُ إن وقع وقع في الهيكل لا في الصفوف.
     ومَن أراد قياسَ الجولة نفسِها ساقها في `browser_test.html` حيث تُقاد فعلاً. */
  const SCREENS = [
    '/',                                  // الخريطة
    '/?preview=1&v=2#/review',            // مسارُ المراجعة
    '/?preview=1&v=3#/parent',            // بوابةُ الوالد — أعرضُ صندوقٍ في البذرة
    '/?preview=1&v=4#/contrast/s3-2',     // تمييزٌ صوتيٌّ خالص (الجلسة ٣)
    '/?preview=1&v=5#/ear/s4-3',          // التقطيعُ الشفهيّ بأزراره (الجلسة ٣)
  ];

  /* ————— **وهدفُ اللمس تحت إصبع طفل** (الجلسة ١٠) —————
     مقاسُ الشاشة يُقاس في المحاكاة، **وإصبعُ الطفل لا يُحاكى** — لكنّ أرضيّةَ
     الهدف تُقاس: ٤٤ بكسلاً حدُّ المنصّة الأدنى، **وسنّةُ العائلة أخذت به**
     (احسب م٦: «لهدف اللمس أرضيّةٌ ٤٤بك لا ينزل عنها»)، ورمزُنا `--tap` فوقه
     (‏٣٫٧٥ ريم ≈ ٦٠). فما نزل عن الأرضية يُسمّى بموضعه لا يُوصَف.
     **ويُقاس على المقاس الأصغر كما على الأكبر**: صندوقٌ يضيق بضيق المنظور. */
  const TAP_FLOOR = 44;
  const CLICKABLE = 'button, a[href], [role="button"], input, select, summary,'
                  + ' [tabindex]:not([tabindex="-1"])';

  /** اسمُ العنصر كما يُعرَف في الشيفرة — صنفُه وأوّلُ كلامه، ليُقصد بالإصلاح. */
  const nameOf = (el) => {
    const cls = (el.getAttribute('class') || '').trim().split(/\s+/)[0] || '';
    const text = (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 18);
    const aria = (el.getAttribute('aria-label') || '').trim().slice(0, 18);
    return `${el.tagName.toLowerCase()}${cls ? '.' + cls : ''}`
         + (text || aria ? ` «${text || aria}»` : '');
  };

  /** كلُّ هدفِ لمسٍ **مرسومٍ** نزل ضلعُه الأصغر عن الأرضية. */
  const tapsUnder = (doc) => {
    const out = [];
    for (const el of doc.querySelectorAll(CLICKABLE)) {
      const r = el.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) continue;      // غيرُ مرسومٍ الآن — لا يُحاسَب
      const side = Math.min(r.width, r.height);
      if (side < TAP_FLOOR) out.push({ side: Math.round(side * 10) / 10, what: nameOf(el) });
    }
    return out;
  };

  let worst = { overflow: -1e9 };
  const small = new Map();          // اسمُ الهدف → أصغرُ ما قِيس له (لا يتكرّر بتكرّر الشاشات)
  for (const src of SCREENS) {
    frame.src = src;
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    await new Promise((r) => setTimeout(r, 1200));
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    const row = {
      overflow: doc.documentElement.scrollWidth - win.innerWidth,
      width: win.innerWidth,
      height: win.innerHeight,
      at: src,
    };
    for (const t of tapsUnder(doc)) {
      const seen = small.get(t.what);
      if (!seen || t.side < seen.side) small.set(t.what, { ...t, at: src });
    }
    if (row.overflow > worst.overflow) worst = row;
  }

  worst.floor = TAP_FLOOR;
  worst.taps = [...small.values()].sort((a, b) => a.side - b.side);

  await fetch('/result', { method: 'POST', body: JSON.stringify({ from: 'english', rows: [worst] }) });
</script>
</body>
</html>

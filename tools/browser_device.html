<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تطبيق الإنكليزية على مقاسات الآيباد</title>
<style>html,body{margin:0;height:100%}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="/"></iframe>
<script type="module">
  /* صفحةُ الجهاز: التطبيقُ يملأ المنظور بمقاس الآيباد الذي فُتحت به النافذة،
     فيُقاس **الفائضُ الأفقيّ** حيث يقع فعلاً — لا في إطارٍ ذي مقاسٍ آخر.
     و«بلا فائض أفقي» عهدٌ مطلق (`METHOD.md §١٠.٧`): طفلُ الرابعة لا يسحب ليجد زرّاً. */
  const frame = document.getElementById('app');

  /* **وتُقاس شاشاتُ التطبيق لا الخريطةُ وحدَها**: أوسعُ ما فيه اليوم لوحةُ الوالد
     (بطاقاتُ الوحدات صفّان وقوائمُ التحكّم)، ثم شاشاتُ المحطات بأشكالها.
     **ويُبلَّغ أسوأُ ما قِيس لا آخرُه**.

     **وشاشةُ المحطة تُقاس في خطوة «شاهِدْ»** — وهي ما يظهر بلا قيادة: صفوفُ الاختيار
     خلفها تلفّ بطبعها (`flex-wrap`)، فالفائضُ إن وقع وقع في الهيكل لا في الصفوف.
     ومَن أراد قياسَ الجولة نفسِها ساقها في `browser_test.html` حيث تُقاد فعلاً. */
  const SCREENS = [
    '/',                                  // الخريطة
    '/?preview=1&v=2#/review',            // مسارُ المراجعة
    '/?preview=1&v=3#/parent',            // بوابةُ الوالد — أعرضُ صندوقٍ في البذرة
    '/?preview=1&v=4#/contrast/s3-2',     // تمييزٌ صوتيٌّ خالص (الجلسة ٣)
    '/?preview=1&v=5#/ear/s4-3',          // التقطيعُ الشفهيّ بأزراره (الجلسة ٣)
  ];

  let worst = { overflow: -1e9 };
  for (const src of SCREENS) {
    frame.src = src;
    await new Promise((r) => frame.addEventListener('load', r, { once: true }));
    await new Promise((r) => setTimeout(r, 1200));
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    const row = {
      overflow: doc.documentElement.scrollWidth - win.innerWidth,
      width: win.innerWidth,
      height: win.innerHeight,
      at: src,
    };
    if (row.overflow > worst.overflow) worst = row;
  }

  await fetch('/result', { method: 'POST', body: JSON.stringify({ from: 'english', rows: [worst] }) });
</script>
</body>
</html>

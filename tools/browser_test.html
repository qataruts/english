<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>فحصُ تطبيق الإنكليزية في متصفّحٍ حقيقي</title>
<style>body{font-family:system-ui;padding:2rem;direction:rtl}</style>
</head>
<body>
<p>يُشغَّل الفحص… (تُرسَل النتائج إلى <code>POST /result</code> ثم يُقتل المتصفّح)</p>

<iframe id="app" src="/?seed=7" style="width:834px;height:1194px;border:1px solid #ccc"></iframe>

<script type="module">
  /* عدّةُ المتصفّح — **بذرةُ المنصة**: ما لا يُثبته إلا متصفّحٌ حقيقي.
     الجلسة ٠ تفحص **بذرةً فارغة**: أتفتح؟ أهي RTL بعلامتها؟ أأرقامُها مشرقية؟
     أفيها محرفُ إيموجي يُسلَّم لخطّ النظام؟ أتعمل بوابةُ الوالد؟ **وأتتعاقب القناةُ
     الصوتية المنسوخة أم تتراكب؟**
     والجلساتُ التالية تضيف فحوصَ شاشاتها هنا (لا تُنشئ عدّةً ثانية). */

  const out = [];
  const ok = (cond, msg) => out.push({ ok: !!cond, msg });

  /* **عطبُ الصفحة يُبلَّغ ولا يصمت**: خطأٌ واحد يوقف هذا النصّ فلا تصل نتيجةٌ أصلاً،
     فيُقرأ «لم تصل نتيجة» بطءَ جهازٍ أو قِصَرَ مهلة — وهو عينُ الالتباس الذي وُجد له
     `--self-test` في `browser_test.py`. فما مضى من الفحوص يُرسَل، ومعه العطبُ نفسُه
     فحصاً أحمر باسمه. */
  const report = (rows) => fetch('/result', { method: 'POST', body: JSON.stringify({ from: 'english', rows }) });

  /* **والتعلّقُ يُبلَّغ كما يُبلَّغ العطب**: انتظارُ حدثٍ لا يجيء يوقف النصَّ بلا خطأ،
     فلا يصل شيء. فمهلةٌ حارسة ترسل ما تمّ ومعه سطرٌ أحمر يسمّي التعلّق. */
  /* **والمهلةُ تتبع ما يُساق، وتوسيعُها قرارٌ معلَن لا صمت** (قاعدةُ بلاغ الجهاز
     المزدحم): كانت ١٥٠ ثانية وتسوق خمسَ محطات؛ وصارت الجلسةُ ٣ تسوق ثلاثَ عشرةَ
     محطةً ومراجعةً وبوابةً مرّتين (إخفاقاً ثم عبوراً) فرُفعت إلى ٤٨٠. **والجلسةُ ٤
     تسوق خمسَ درجاتِ حرفٍ وبوابةً ثانية مرّتين** (ثمانيةَ عشرَ مساقاً لا ثلاثةَ عشر)،
     فرُفعت إلى ٦٦٠ ومعها مهلةُ `browser_test.py` إلى ٨٤٠ — وتبقى **دونها** كي يصل
     التقريرُ الناقصُ بدل أن يُقتَل المتصفّح صامتاً.
     **والجلسةُ ٥ تسوق سبعَ درجاتٍ أخرى** (ح٦–ح١٢) وشاهدَي الشائكة والجبهتين
     ومراجعةً ثانية — سبعةٌ وعشرون مساقاً لا ثمانيةَ عشر، فرُفعت إلى ٩٦٠ ومعها
     مهلةُ الأداة إلى ١١٤٠. **والجلسةُ ٧ تسوق الرحلةَ كلَّها**: ثلاثُ درجاتِ بدائل
     وعشرُ قصصٍ وستُّ محطاتِ توسعةٍ وبوابةٌ ثالثة مرّتين — **خمسون مساقاً لا سبعةٌ
     وعشرون**، فرُفعت إلى ١٥٦٠ ومعها مهلةُ الأداة إلى ١٨٠٠ (وتبقى المهلةُ الأولى
     **دونها** كي يصل التقريرُ الناقصُ بدل أن يُقتَل المتصفّح صامتاً).
     **والجلسةُ ٨ تزيد مساقين وإعادتين**: محطةَ المتكلم والمخاطَب (س٥-٧) وشاهدَ
     الشائكة الثاني على درجة الضمائر التي أيقظتها، **ولشاهدَي الشائكة إعادةٌ عند
     تخلّف القرعة** (حدُّها ثلاثٌ لكلٍّ) — **اثنان وخمسون مساقاً لا خمسون، وأربعةٌ
     محتملةٌ فوقها**، فرُفعت إلى ١٦٤٠ ومعها مهلةُ الأداة إلى ١٩٠٠ (والأولى دون
     الثانية كما هي).
     **وجلسةُ الحسم (ح) تزيد سبعةَ مساقات**: محطةُ كلمات الأزواج (س١-٧) ومحطةُ
     الصوت الأخير (س٤-٥) **وخمسُ محطاتِ عودةِ الأذن** في مسار الحرف — **تسعةٌ
     وخمسون مساقاً لا اثنان وخمسون**، فرُفعت إلى ١٩٠٠٠٠٠ ومعها مهلةُ الأداة إلى
     ٢٢٠٠ ثانية (والأولى دون الثانية كما هي، كي يصل التقريرُ الناقص).
     **قرارٌ معلَن لا صمت** (قاعدةُ بلاغ الجهاز المزدحم). */
  const watchdog = setTimeout(() => {
    report([...out, { ok: false, msg: 'تعلّقت صفحةُ الفحص قبل تمامها (انتظارٌ لم ينتهِ)' }]);
  }, 1900000);

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const frame = document.getElementById('app');

  /* **والمساقُ مبذورٌ فيصير حتمياً** (بندُ الجلسة ٩ — علاجُ تذبذب سحب الجولات):
     بضعةُ فحوصٍ هنا تشترط أن يُسحَب **نوعُ جولةٍ بعينه** (الرسمُ البديل · الشائكةُ
     الناضجة · الصائتُ الأوسط)، وبذرةُ الجولة عند الطفل زمنيةٌ بطبعها — فكانت
     تسقط في تشغيلٍ وتمرّ في آخر بلا تغييرِ حرفٍ في الشجرة، **وحمرةٌ تتبدّل بلا
     سببٍ تُعلَّم أن تُتجاهَل**. فيُساق التطبيقُ ببذرةٍ معلَنة في عنوانه
     (`?seed=` — أخو `?dev=1` و`?preview=1`، ومصدرُها `roundSeed` في `ui.js`)،
     **وتُحمَل في كل إعادة تحميل** وإلّا انقطع الحبلُ عند أوّل `reopen`.
     والطفلُ على حاله: بلا الوسم تبقى البذرةُ زمنية. */
  const APP_URL = frame.getAttribute('src');

  /* **لا يُنتظَر حدثٌ، ولا يُصدَّق `readyState`** — عيبان مقيسان ساعةَ كُتبت هذه
     الصفحة، وكلاهما يُقرأ «لم تصل نتيجة» أو حمرةً كاذبة لا عطباً في التطبيق:
       ١) وحدةُ هذه الصفحة مؤجَّلةٌ بطبعها (`type="module"`)، فقد يكون الإطارُ حمّل
          قبل أن نصل — فانتظارُ `load` عندئذٍ انتظارٌ أبديّ.
       ٢) و**`readyState === 'complete'` يصدُق على `about:blank`**: الإطارُ قبل أن
          يبدأ تنقّلَه مستندٌ فارغٌ «تامّ»، فمن قنع به قاس **صفحةً بيضاء** وظنّها
          التطبيق — فتحمرّ فحوصُ الخريطة والعلامة والاتجاه جميعاً وهي سليمة.
     فالمقياسُ **ما نبحث عنه نفسُه**: نُمهل حتى يظهر، ونحكم بغيابه إن لم يظهر. */
  const waitFor = async (fn, ms = 10000) => {
    const end = performance.now() + ms;
    for (;;) {
      let value = null;
      try { value = fn(); } catch { value = null; }
      if (value) return value;
      if (performance.now() > end) return null;
      await wait(100);
    }
  };
  const appDoc = () => {
    const d = frame.contentDocument;
    return d && d.location && d.location.href !== 'about:blank' ? d : null;
  };

  /* **وعطبُ التطبيق نفسِه يُبلَّغ ولا يصمت** (نظيرُ ما لهذه الصفحة في رأسها): خطأٌ في
     وحدةٍ يوقف `render` فتبقى الشاشةُ السابقة كما هي — فيُقرأ ذلك «المحطةُ لم تُفتَح»
     عيباً في الفحص أو في القفل، والعيبُ في الشيفرة. فيُنصَت لأخطاء الإطار ووعوده
     المرفوضة، ويُرسَل ما وقع فحصاً باسمه. */
  const appErrors = [];
  const watchApp = (w) => {
    if (!w || w.__watched) return;
    w.__watched = true;
    w.addEventListener('error', (e) => appErrors.push(e.message || String(e.error)));
    w.addEventListener('unhandledrejection', (e) =>
      appErrors.push(String(e.reason && (e.reason.message || e.reason))));
  };

  try {
  const mapEl = await waitFor(() => appDoc()?.querySelector('.map'));
  let doc = appDoc() || frame.contentDocument;
  let win = frame.contentWindow;
  watchApp(win);
  ok(!!mapEl, 'التطبيقُ يفتح فعلاً في الإطار (لا مستندٌ فارغ يُظنّ تطبيقاً)');

  // ————— ١. التطبيق يفتح، والشاشةُ الأولى خريطة —————

  ok(!doc.querySelector('.boot'), 'التطبيق يفتح ويحلّ محلَّ سطر التحميل');
  ok(!!doc.querySelector('.map'), 'والشاشةُ الأولى خريطةُ الرحلة');
  ok(doc.documentElement.getAttribute('dir') === 'rtl'
    && doc.documentElement.getAttribute('lang') === 'ar',
    'والصفحةُ عربيةٌ من اليمين (`dir=rtl` · `lang=ar`)');

  // ————— ٢. الرحلةُ مرسومةٌ من بياناتها — معيارُ قبول الجلسة ١ —————
  //
  // **والعددُ يُقرأ من المنهج لا يُكتب هنا** (عهدُ «أرقامٌ محسوبة لا مكتوبة»): تُستورَد
  // `curriculum.js` نفسُها في هذه الصفحة ويُقابَل ما أعلنته بما رُسم في الـDOM. فلو
  // كُتب رقمٌ بيد لَصار الحارسُ يحرس رقمَه لا الرحلة، ولَخضِر يوم تسقط محطةٌ ويُصحَّح
  // الرقمُ معها. **وهذه هي الوصلةُ التي كانت معيارَ الجلسة ٠**: بذرةٌ فارغة ⇒ خريطةٌ
  // تقول حالَها، ورحلةٌ مكتوبة ⇒ خريطةٌ ترسمها كلَّها بلا سطرٍ يُعدَّل في وحدةٍ أخرى.

  const curriculum = await import('/js/curriculum.js');
  const sections = curriculum.sections();
  const nodeCount = sections.reduce((n, s) => n + (s.nodes || []).length, 0);

  ok(!doc.querySelector('.note--empty'),
    'وخريطةُ الرحلة لم تعد تقول «لم تُكتب بعد» — كُتب المنهجُ في الجلسة ١');
  ok(doc.querySelectorAll('.station').length === sections.length,
    `وعلى الخريطة ${sections.length} قسماً — عينُ ما يُرجعه \`sections()\``);

  /* **والعقدُ تُعَدّ في المفرود لا في المطويّ**: الخريطةُ تطوي ما بَعُد عن جبهة الطفل
     (`FOLD_NEAR` — طيٌّ كسول من البذرة)، فرأسُ المطويّة وحدَه يُرسَم. فيُقاس القسمُ
     المفرودُ الأول: عقدُه في الـDOM = عقدُه في البيانات. ولو عُدَّت العقدُ كلُّها
     لاحمرَّ الحارسُ على **طيٍّ سليم** — وهو أسوأُ الحمرة: صحيحةُ العدد كاذبةُ الحكم. */
  const opener = sections[0];
  const drawn = [...doc.querySelectorAll('.station')][0].querySelectorAll('.node');
  ok(drawn.length === opener.nodes.length,
    `وأولُ قسمٍ («${opener.title}») مفرودٌ بعقده ${opener.nodes.length} — عينُ ما يحمله`);
  ok(doc.querySelectorAll('.node').length > 0
    && doc.querySelectorAll('.node').length <= nodeCount,
    `والمرسومُ من عقد الرحلة (${nodeCount}) ما فُرد منها لا أكثر`);

  // **والقفلُ التسلسليّ مرئيّ**: العقدةُ الأولى وحدَها مفتوحةٌ على تقدّمٍ خالٍ،
  // وما بعدها مقفلٌ — وهو ما يجعل قيدَ الاقتران ممكناً أصلاً (ترتيبٌ لا يُقفَز).
  ok(drawn.length > 1 && !drawn[0].classList.contains('node--locked')
    && drawn[1].classList.contains('node--locked'),
    'وأولُ عقدةٍ مفتوحةٌ والتي تليها مقفلة (القفلُ التسلسليّ مرئيّ على تقدّمٍ خالٍ)');

  // ————— ٣. العلامةُ **وقعت** (`docs/REVIEW_IDENTITY.md`، ١٦ أغسطس ٢٠٢٦) —————
  //
  // **وهذا حارسُ هويةٍ في الشاشة**: كان يقيس إعلانَ النيابة ما دامت قائمة، فلمّا
  // وقعت الهويةُ صار يقيس وقوعَها — صفرُ `data-pending`، والعلامةُ `Listen!` بخطّها
  // المقرَّر معزولةً `ltr`. (واللوحُ نفسُه يحرسه `tools/test_identity.mjs`.)

  const brand = doc.querySelector('.brand');
  ok(!!brand && !brand.dataset.pending,
    'وعلامةُ التطبيق **بلا إعلان نيابة** في DOM — وقعت الهوية (صفرُ `data-pending`)');
  const word = doc.querySelector('.brand-word');
  ok(!!word && word.textContent.trim() === 'Listen!' && word.getAttribute('dir') === 'ltr',
    `والعلامةُ المرسومة «${word ? word.textContent.trim() : '—'}» معزولةٌ \`ltr\` في ترويسةٍ عربية`);
  ok(!!word && win.getComputedStyle(word).fontFamily.includes('Caveat'),
    'وتُرسَم بخطّ العلامة Caveat وحدَه (لا خطّ النصّ)');
  ok(!!brand && brand.children.length === 1 && !brand.querySelector('svg'),
    'والعلامةُ **الكلمةُ وحدَها بلا علامةٍ فوقها** — كما خُتمت الأيقونةُ نفسُها');

  // **والعلامةُ هي اللاتينيُّ الوحيد في شاشة الخريطة — وهي المستثناةُ بسببها**:
  // «أولُ كلمةٍ إنكليزية يلقاها الطفل: العلامةُ نفسُها مادةُ تدريس» (حكمُ المالك،
  // تعديلُ ١٦ أغسطس مساءً). فالاستثناءُ **مكتوبٌ ومقيس**: لا يلزم الطفلَ فعلٌ
  // وسيلتُه قراءتُها (لا زرَّ عليها)، ولا لاتينيَّ سواها في الشاشة.
  const mapLatin = doc.querySelector('.app')?.cloneNode(true);
  for (const el of mapLatin?.querySelectorAll('.brand-word') || []) el.remove();
  ok(!!mapLatin && !/[A-Za-z]/.test(mapLatin.textContent || ''),
    'ولا لاتينيَّ في شاشة الخريطة سوى العلامة — وهي **مادّةُ تدريسٍ مستثناةٌ بحكم المالك**');
  ok(!!brand && !brand.closest('button'),
    'والعلامةُ لا تُلمَس ولا يُبنى عليها فعل (قاعدةُ اللاقراءة قائمةٌ عليها)');

  // ————— ٤. «أيقونات لا إيموجي»: صفرُ محرفٍ يُسلَّم لخطّ النظام —————

  /* **والقاعدةُ تُقرأ من موضعها لا تُكتب هنا ثانيةً** (عيبٌ مقيسٌ ساعةَ كُتبت هذه
     الصفحة): كتبتُ نطاقاً تقريبياً فحمّرته «★» — وهي **محرفٌ نصّيّ** يرسمه خطُّ
     النصّ نفسُه، و`ui.js` يُخرجها صراحةً («وبها تخرج ✦ و✓ و★»). فحارسٌ أشدُّ من
     القاعدة التي يحرسها **يمنع الصواب** ويُقرأ عطباً — والمصدرُ واحد:
     `isEmoji` نفسُها من `ui.js`، فيومَ تتبدّل القاعدةُ يتبدّل الحارسُ معها. */
  const { isEmoji } = await import('/js/ui.js');
  const textOf = (root) => [...root.querySelectorAll('*')]
    .flatMap((el) => [...el.childNodes])
    .filter((n) => n.nodeType === 3)
    .map((n) => n.nodeValue).join('');
  const glyphs = [...textOf(doc.body)].filter((ch) => isEmoji(ch));
  ok(glyphs.length === 0,
    `ولا محرفَ إيموجي واحد يُسلَّم لخطّ النظام في نصّ الشاشة `
    + `(${glyphs.length ? glyphs.join('') : 'صفر'} — والقاعدةُ \`isEmoji\` من \`ui.js\`)`);

  // ————— ٥. أرقامُ الواجهة مشرقية —————

  const stars = doc.querySelector('.pill--stars');
  ok(!!stars && !/[0-9]/.test(stars.textContent),
    `وعدّادُ النجوم بأرقامٍ مشرقية («${stars ? stars.textContent.trim() : '—'}»)`);

  // ————— ٦. **لا فعلَ يلزم الطفلَ وسيلتُه الوحيدة قراءة** (`METHOD.md §٩·٢`) —————
  //
  // قاعدةُ العائلة المرقّاة، **وهي عندنا بلغتين**: جمهورُنا قبل-قارئ إنكليزيةً
  // بالبناء وعربيةً بالواقع. فكلُّ زرٍّ في شاشة الطفل له صورةٌ دالّة أو أيقونة —
  // والحارسُ **يجرد ولا يُصدَّق**: اليومَ لا زرَّ تمرينٍ بعد، فيمرّ على ما هو قائم
  // ويحمرّ يومَ يُضاف زرٌّ نصّيّ (نظيرُ حرّاس الغياب).

  const childBtns = [...doc.querySelectorAll('.topbar button, .map button')]
    .filter((b) => !b.closest('.dev'));
  const bare = childBtns.filter((b) => !b.querySelector('svg, img') && b.textContent.trim());
  ok(childBtns.length > 0 && bare.length === 0,
    `وكلُّ زرٍّ في شاشة الطفل له صورةٌ دالّة لا نصٌّ وحدَه (${childBtns.length} زرّاً)`
    + (bare.length ? ` — نصّيّ: ${bare.map((b) => b.textContent.trim()).join('، ')}` : ''));

  // ————— ٧. `hidden` يخفي فعلاً (درسُ اللوح المنقول) —————

  const probe = doc.createElement('div');
  probe.className = 'dl';
  probe.hidden = true;
  doc.body.append(probe);
  ok(win.getComputedStyle(probe).display === 'none',
    'و`hidden` يخفي فعلاً ولو أعطى اللوحُ العنصرَ `display` صريحاً');
  probe.remove();

  // ————— ٨. المراجعةُ بلا حصيلة تردّ إلى الخريطة ولا تعطب —————

  win.location.hash = '#/review';
  ok(!!await waitFor(() => appDoc()?.querySelector('.map')),
    'ومسارُ المراجعة بلا حصيلةٍ يردّ الطفلَ إلى الخريطة (لا شاشةَ خطأ)');

  // ————— ٩. بوابةُ وليّ الأمر: تسأل، وترفض الخطأ، وتفتح بالصواب —————

  win.location.hash = '#/parent';
  await waitFor(() => appDoc()?.querySelector('.gate'));
  doc = appDoc();
  ok(!!doc.querySelector('.gate') && !doc.querySelector('.audit'),
    'ولوحةُ الوالد خلف بوابةٍ حسابية (لا تُفتح بلمسة طفل)');
  const ask = doc.querySelector('.gate .giant')?.textContent || '';
  ok(/×/.test(ask) && !/[0-9]/.test(ask), `وسؤالُها ضربٌ بأرقامٍ مشرقية («${ask.trim()}»)`);

  const AR = '٠١٢٣٤٥٦٧٨٩';
  const [a, b] = ask.split('×').map((part) =>
    Number([...part.trim()].map((c) => AR.indexOf(c)).join('')));
  const input = doc.querySelector('.gate input');
  const enter = doc.querySelector('.gate-go');
  input.value = String(a * b + 1);
  enter.click();
  await wait(250);
  doc = appDoc();
  ok(!!doc.querySelector('.gate') && !doc.querySelector('.audit'),
    'وجوابٌ خاطئ لا يفتحها (ويُبدَّل السؤال)');

  const ask2 = doc.querySelector('.gate .giant').textContent;
  const [c, d] = ask2.split('×').map((part) =>
    Number([...part.trim()].map((ch) => AR.indexOf(ch)).join('')));
  doc.querySelector('.gate input').value = String(c * d);
  doc.querySelector('.gate-go').click();
  await waitFor(() => appDoc()?.querySelector('.audit'));
  doc = appDoc();
  ok(!!doc.querySelector('.audit'), 'والجوابُ الصحيح يفتح اللوحة');
  ok(/راجِع مختصاً/.test(doc.body.textContent),
    'وحدُّ النطاق معلَنٌ فيها (تدريسٌ وقياسٌ لا تشخيص — `METHOD.md §١٣`)');
  ok(/الوحدة × المدى × نوع التمرين/.test(doc.body.textContent),
    'ومفتاحُ القياس معلَنٌ للوالد بنصّ `METHOD.md §٧`');

  /* ————— ٩ب. **أقسامُ اللوحة الثلاثة وإعلاناتُها** (بندُ الجلسة ٨) —————

     ما يقرؤه الوالدُ في اللوحة **شرطُ قبولٍ لا زينة**: قسما المهارة (سمعٌ وحرف)
     **وقيدُ الاقتران مرئياً بعدّاده**، وسقفُ اليوم، والترديدُ يُدعى ولا يُقاس،
     وحدودُ النطاق. ويُقاس هنا **ما رُسم** لا ما كُتب في الشيفرة. */

  const panelHas = (re) => re.test(doc.body.textContent);
  const couplingPills = [...doc.querySelectorAll('.audit .coupling .pill')];
  ok(couplingPills.length === 3 && couplingPills.every((p) => !/[0-9]/.test(p.textContent)),
    `🔗 **وقيدُ الاقتران مرئيٌّ بعدّاده** (${couplingPills.map((p) => p.textContent.trim())
      .join(' · ') || 'لا عدّاد'}) — بأرقامٍ مشرقية`);
  ok(panelHas(/يقرأ ما أتقن سمعَه/), 'ونصُّ القيد معلَنٌ للوالد («يقرأ ما أتقن سمعَه»)');
  ok(panelHas(/سقفُ اليوم/) && panelHas(/١٥ دقيقة/),
    'وسقفُ اليوم خمسَ عشرةَ دقيقة معلَنٌ دائماً (`METHOD.md §١٢-٨`)');
  ok(panelHas(/الترديدُ يُدعى ولا يُقاس/),
    'و«الترديدُ يُدعى ولا يُقاس» معلَنٌ نصّاً (§١٢-٥ — لا قياسَ نطق)');
  ok(!!doc.querySelector('.audit .backup-save') && !!doc.querySelector('.audit .file-label'),
    'والنسخُ الاحتياطي والاستعادةُ في اللوحة بزرَّيهما');
  /* **ولا نجمتَي Markdown في نصٍّ يُعرَض** (عيبٌ أُمسك في الجلسة ٨ بأوّل عرضٍ للوحة
     على عينٍ بشرية): نصوصُ اللوحة تُبنى عُقَداً نصّية لا Markdown، فالتوكيدُ بـ`<b>`
     لا بنجمتين — وكانت `**سمعٌ وصور لا حروف**` تُقرأ بنجومها في توصية اليوم. */
  ok(!/\*\*/.test(doc.querySelector('.audit')?.textContent || ''),
    'ولا نجمتَي توكيدٍ تُقرأ في نصّها (اللوحةُ نصٌّ مبنيّ لا Markdown)');

  /* ————— ٩ج. **البابان الاختياريان ومؤشّرُ وضع الدعم على الشاشة نفسِها** (الجلسة ب) —————

     **ما لا يُثبته إلا متصفّح**: أنّ العلامةَ **تُرى** (ظلٌّ داخليّ في شارة الشريط
     اللاصق) وأنّها **لا تَسِمُ الطفل** (لا كلمةَ تُكتب) و**لا تزحزح تخطيطاً** (ارتفاعُ
     الشارة والشريط كما هما بايتاً ببايت). وحارسُ العقد يقيس المصدرَ واللوحَ، وهذا
     يقيس **ما وقع على الشاشة**.

     **ويُطفَأ الوضعُ في آخره**: بقيّةُ البطارية تقيس السلوكَ القائم، فلو بقي مشتغلاً
     لقاست جرعةً وحوضاً غيرَ ما تعلن. */

  win.location.hash = '#/';
  await waitFor(() => appDoc()?.querySelector('.map'));
  doc = appDoc();
  const barOf = () => appDoc().querySelector('.topbar');
  const pillOf = () => appDoc().querySelector('.topbar .pill');
  const boxOf = (el) => win.getComputedStyle(el).boxShadow;
  const beforeMark = { pill: pillOf().offsetHeight, bar: barOf().offsetHeight, shadow: boxOf(pillOf()) };
  ok(!appDoc().documentElement.classList.contains('support-on'),
    'ووضعُ الدعم مطفأٌ ابتداءً على الشاشة — لا صنفَ على الجذر ولا علامةَ في الشريط');

  win.location.hash = '#/parent';
  await waitFor(() => appDoc()?.querySelector('.audit'));
  doc = appDoc();
  ok(!!doc.querySelector('.support-mode') && !!doc.querySelector('.start-placement'),
    'وبابا «وضع الدعم» و«امتحان اللحاق» في لوحة وليّ الأمر (لا في شاشة طفل)');
  ok(/لا يشخّص ولا يعالج/.test(doc.body.textContent)
    && /لا يَعِد بقدرِ أثرٍ/.test(doc.body.textContent),
    'وسطرُ الوعد الصادق مقروءٌ فيها بحدوده');
  doc.querySelector('.support-mode').click();
  await waitFor(() => appDoc()?.querySelector('.support-knob'));
  doc = appDoc();
  const knobs = [...doc.querySelectorAll('.support-knob')];
  ok(knobs.length === 4,
    `وتشغيلُه يُظهر مقابضَه الأربعة (${knobs.map((k) => k.textContent.replace('✓', '').trim()).join(' · ')})`);
  ok(knobs.some((k) => /نموذج/.test(k.textContent)),
    'ومنها **مقبضُنا وحدَنا**: نموذجُ الصوت الإنكليزيّ أبطأ');

  win.location.hash = '#/';
  await waitFor(() => appDoc()?.querySelector('.map'));
  doc = appDoc();
  const afterMark = { pill: pillOf().offsetHeight, bar: barOf().offsetHeight, shadow: boxOf(pillOf()) };
  ok(doc.documentElement.classList.contains('support-on')
    && doc.documentElement.classList.contains('calm'),
    'وعلى شاشة الطفل: صنفا الوضع والهدوء على الجذر في اللحظة نفسِها');
  ok(afterMark.shadow !== beforeMark.shadow && /inset/.test(afterMark.shadow),
    `**والعلامةُ تُرى**: ظلٌّ داخليّ في شارة الشريط اللاصق («${afterMark.shadow.slice(0, 60)}…»)`);
  ok(afterMark.pill === beforeMark.pill && afterMark.bar === beforeMark.bar,
    `**ولا تزحزح تخطيطاً**: الشارةُ ${afterMark.pill}px والشريطُ ${afterMark.bar}px كما كانا`);
  ok(barOf().getAttribute('title') === 'وضعُ الدعم مشتغل',
    'واسمُها لوليّ الأمر في `title` وحدَه');
  ok(!/الدعم|أبطأ|بطء/.test(doc.querySelector('.map').textContent)
    && !/الدعم/.test(barOf().textContent),
    '**ولا كلمةَ تَسِمُ الطفل**: لا في الشريط ولا في الخريطة — ولا رمزَ بطء');
  ok(!/امتحان اللحاق/.test(doc.body.textContent),
    'ولا زرَّ لامتحان اللحاق في شاشة طفلٍ البتّة');

  win.location.hash = '#/parent';
  await waitFor(() => appDoc()?.querySelector('.audit'));
  appDoc().querySelector('.support-mode').click();
  await wait(200);
  win.location.hash = '#/';
  await waitFor(() => appDoc()?.querySelector('.map'));
  doc = appDoc();
  ok(!doc.documentElement.classList.contains('support-on')
    && !barOf().hasAttribute('title') && boxOf(pillOf()) === beforeMark.shadow,
    'وتغيب بالإطفاء كما جاءت — والشجرةُ تعود إلى ما كانت عليه بايتاً ببايت');

  // ————— ١٠. **حارسُ التعاقب على القناة المنسوخة** (معيارُ قبول الجلسة ٠) —————
  //
  // الحرّاسُ الذين **يعدّون التشغيلات ولا يقيسون التعاقب** أخضرُ كاذب (قاعدةُ اقرأ
  // المقيَّدة، وبلاغُ الميدان ١ عند احسب). فهذا يقيس **لحظاتِ البدء والتمام** في
  // متصفّحٍ حقيقيّ: لا لحظةَ فيها صوتان، والثاني يبدأ **بعد** تمام الأول لا فوقه.
  //
  // و`test_audio_stack.mjs` أخوه في node بمشاهده الخمسة (بعثُ الموقوف، والتتابعُ
  // المتجاوَز) — وهذا يقيس القناةَ **وهي محمَّلةٌ في متصفّح** كما تعمل عند الطفل.

  const timeline = [];
  const spoken = [];      // {text, lang} — كلُّ لجوءٍ إلى النطق الآليّ
  let failKey = null;     // مفتاحٌ نجعل ملفَّه يتعثّر (لنقيس مسار الاحتياط)
  const AUDIO_MS = 140;

  window.Audio = class extends EventTarget {
    constructor(src = '') { super(); this.preload = ''; this.src = src; }
    set src(v) {
      this._src = v || '';
      this.__key = (String(this._src).split('/').pop() || '').split('?')[0].replace('.mp3', '');
    }
    get src() { return this._src; }
    play() {
      if (failKey && this.__key === failKey) {
        setTimeout(() => this.dispatchEvent(new Event('error')), 10);
        return Promise.resolve();
      }
      this.__row = { key: this.__key, t0: performance.now(), t1: Infinity };
      timeline.push(this.__row);
      this.__timer = setTimeout(() => {
        this.__close();
        this.dispatchEvent(new Event('ended'));
      }, AUDIO_MS);
      return Promise.resolve();
    }
    __close() {
      clearTimeout(this.__timer);
      if (this.__row && this.__row.t1 === Infinity) this.__row.t1 = performance.now();
    }
    pause() { this.__close(); }
    load() {}
    removeAttribute() { this.src = ''; }
  };
  window.SpeechSynthesisUtterance = class {
    constructor(text) { this.text = text; this.__i = spoken.push({ text, lang: '' }) - 1; }
    set lang(v) { spoken[this.__i].lang = v; }
    get lang() { return spoken[this.__i].lang; }
  };
  /* `speechSynthesis` وصفٌ للقراءة على `window` — فيُبدَّل بالتعريف لا بالإسناد
     (والإسنادُ في وحدةٍ صارمة يرتمي). */
  Object.defineProperty(window, 'speechSynthesis', {
    configurable: true,
    value: { cancel() {}, speak(u) { setTimeout(() => u.onend?.(), 10); } },
  });

  const audio = await import('/js/audio.js');

  /* **ونصوصُ هذا المشهد من البنك نفسِه** (إصلاحُ الجلسة ص): كان يقيس بنصّين مكتوبين
     هنا، وكان ذلك صحيحاً **ما دام البنكُ صفراً** — إذ يقع كلُّ نصّ على مسار الملفّ
     (لا فهرسَ ⇒ لا نعرف ⇒ جرّبْ). فلمّا وُلِّدت أوّلُ دفعة صار `cat` في الفهرس
     و«اِسْمَعْ» خارجَه، فمضى الأولُ على الملفّ والثاني على **الاحتياط الآليّ** —
     فبان تشغيلٌ واحد في الخطّ الزمنيّ لا اثنان، **وسقط المشهدُ لا لأنّ القناة عطبت
     بل لأنّ عيّنتَه شاخت**. والقياسُ المقصود (لا صوتان معاً، والثاني بعد تمام الأول)
     **إنّما يُرى على مسار الملفّ**، فتُؤخذ عيّنتُه من الفهرس الحيّ: نصٌّ لكل قناة.
     وبلا بنكٍ يعود إلى نصّيه القديمين فيعمل المشهدُ كما كان — لا رايةَ تُضبط بيد. */
  const bank = await fetch('/audio/manifest.json')
    .then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
  const bankTexts = Object.values(bank);
  const ARABIC_RE = /[؀-ۿ]/;
  const arBank = bankTexts.filter((t) => ARABIC_RE.test(t));
  const enBank = bankTexts.filter((t) => !ARABIC_RE.test(t));
  const arSay = [arBank[0] || 'اِسْمَعْ', arBank[1] || arBank[0] || 'اِسْمَعْ مَرَّةً أُخْرَى'];
  const enSay = [enBank[0] || 'cat', enBank[1] || enBank[0] || 'dog'];

  // نداءان في اللحظة نفسها — توجيهٌ عربيّ ثم مادّةٌ إنكليزية
  const t0 = performance.now();
  const first = audio.play(arSay[0], 'ar');
  const second = audio.play(enSay[0], 'en');
  ok((await first) === true && (await second) === true,
    'والقناةُ تُسمع النداءين كليهما (لا دهسَ ولا وعدٌ معلَّق)');
  const mine = timeline.filter((r) => r.t0 >= t0).sort((x, y) => x.t0 - y.t0);
  ok(mine.length === 2, `وتشغيلان اثنان لا أكثر (${mine.length})`);
  const clash = mine.length === 2 && mine[1].t0 < mine[0].t1 - 1;
  ok(!clash,
    'ولا لحظةَ يعمل فيها صوتان معاً — **الثاني بعد تمام الأول لا فوقه**'
    + (clash ? ` (تراكبٌ ${Math.round(mine[0].t1 - mine[1].t0)}ms)` : ''));

  // إسكاتُ الطفل الناقل: ما في الطابور يسقط، ووعدُه يُسوَّى بهدوء
  // (ومن البنك أيضاً: الإسكاتُ يُقاس على **ما يعمل فعلاً** لا على ما ينتهي قبل أن يبدأ)
  const cut1 = audio.play(arSay[1], 'ar');
  const cut2 = audio.play(enSay[1], 'en');
  await wait(20);
  audio.stop();
  ok((await cut1) === false && (await cut2) === false,
    'والإسكاتُ يُسوّي وعدَ العامل ووعدَ المنتظِر في الطابور بهدوء (لا وعدَ يتجمّد)');

  // ————— ١١. **القناتان اللغويتان**: الاحتياطُ ينطق بلسان قناته —————
  //
  // `METHOD.md §٩·١`: «لا تُنطَق الكلمةُ المدروسة معرَّبةً أبداً». فحتى الاحتياطُ
  // عند تعثّر الملفّ يجب أن يحمل لسانَ نصّه — وهذا يقيسه على `SpeechSynthesisUtterance`
  // نفسِها لا على نيّةٍ في الشيفرة.

  /* **ونصُّ التجربة من خارج البنك بالضرورة** (إصلاحُ الجلسة ص): كان يُجرَّب على
     `fish` بجعل ملفِّه يتعثّر — وكان صحيحاً **ما دام البنكُ صفراً**. فلمّا صار
     لـ`fish` ملفٌّ في البنك صار تعثُّرُه **يصمت بزمنه** ولا يُنطَق آلياً، وهو
     السلوكُ الصحيح المقصود («ما له ملفٌّ ولم يُحمَّل يُعاد طلبُه مرّةً ثم يصمت —
     فالصمتُ خيرٌ من صوتٍ آليّ يسمعه معلّمٌ يقيّم التطبيق»). **فالاحتياطُ الناطق لا
     يُقاس إلا على نصٍّ لا ملفَّ له** — وهو حالُ ما ينتظر في القائمة. فنصٌّ لاتينيٌّ
     لا يدخل بنكاً أبداً، **ويُجرَد غيابُه** قبل أن يُقاس عليه. */
  const enMiss = 'zzq fish';
  ok(audio.hasFile(enMiss) === false, 'ونصُّ تجربة الاحتياط لا ملفَّ له (شرطُ قياسه)');
  await audio.play(enMiss, 'en');
  const en = spoken.find((s) => s.text === enMiss);
  ok(!!en && /^en/.test(en.lang),
    `والاحتياطُ ينطق المادّةَ الإنكليزية بلسانها (${en ? en.lang : 'لم يقع'})`);

  // ونظيرتُها العربية بالشرط نفسِه — و«أَحْسَنْتَ» كانت تمرّ لأنّها تفارق «أَحْسَنْتْ»
  // في البنك **بحركةٍ واحدة**: فرقٌ لا يُعتمَد عليه، ومدخلٌ واحدٌ يوماً ما يُبطله.
  const arMiss = 'نَصُّ تَجْرِبَةٍ لَا مِلَفَّ لَهُ';
  ok(audio.hasFile(arMiss) === false, 'ونظيرُه العربيّ كذلك لا ملفَّ له');
  await audio.play(arMiss, 'ar');
  const ar = spoken.find((s) => s.text === arMiss);
  ok(!!ar && /^ar/.test(ar.lang),
    `ويُنطق التوجيهُ العربيّ بلسانه (${ar ? ar.lang : 'لم يقع'})`);

  // ————— ١٢. **طفلٌ يجتاز س١-١ بلا قراءةٍ ولا زرٍّ نصّيّ** (معيارُ قبول الجلسة ٢) —————
  //
  // لا يُصدَّق «الشاشةُ تعمل» من لقطة: تُقاد المحطةُ **كما يقودها طفل** — نمذجةٌ ثم
  // «تابع» ثم جولاتٌ تُلمَس فيها الصورةُ المطابقة، حتى الاحتفال. والصوتُ لا يُقرأ في
  // DOM، فتُعلن الجولةُ مادّتَها في `data-ask` (سِمةٌ لا يراها طفل) — وبها يعرف
  // الفاحصُ **ما سُئل عنه** فيلمس جوابَه.
  //
  // وقناةُ الصوت تُبدَّل في الإطار نفسِه: بلا بنكٍ مولَّد يقع كلُّ نصٍّ على النطق
  // الآليّ (وهو معلَّقٌ حتى ق١ وق٢)، فتصير المحطةُ دقائقَ انتظار. فتُوضَع القناةُ
  // المزيَّفة نفسُها هناك — **وتُجمَع مفاتيحُ ما نُطق** لتُقابَل بقائمة الانتظار.

  frame.contentWindow.Audio = window.Audio;
  Object.defineProperty(frame.contentWindow, 'speechSynthesis', {
    configurable: true, value: { cancel() {}, speak(u) { setTimeout(() => u.onend?.(), 5); } },
  });
  frame.contentWindow.SpeechSynthesisUtterance = window.SpeechSynthesisUtterance;

  const startedAt = performance.now();
  win.location.hash = '#/quiz/s1-1';
  const screen = await waitFor(() => appDoc()?.querySelector('.station-screen'), 12000);
  doc = appDoc();
  ok(!!screen, 'محطةُ «الأهل» (س١-١) تُفتَح بشاشتها');
  ok(doc.querySelectorAll('.step').length === 3,
    'وحلقتُها ثلاثُ خطوات: شاهِدْ · جرِّبْ مَعِي · وَحْدَكْ');

  // **خطوةُ «شاهِدْ»**: تنتهي بزرّ «تابع» — عرضٌ لا امتحان، ولا يُترك الطفلُ معلَّقاً
  const onward = await waitFor(() => appDoc()?.querySelector('.station-body .next'), 20000);
  ok(!!onward, 'وخطوةُ «شاهِدْ» تعرض وتنطق ثم تفتح «تَابِعْ» (نمذجةٌ بلا مطالبة)');
  ok(!!doc.querySelector('.q-shown .fig[data-word]'),
    'والمعلّمُ يعرض صورةَ الكلمة التي ينطقها');
  onward?.click();

  /**
   * يلمس الجوابَ الصحيح: البطاقةُ (أو **الموضعُ** في «أين أضعه؟») التي تحمل ما
   * أعلنته الجولةُ في `data-ask`. وهو الجوابُ الوحيد الذي يعرفه الفاحص — كما لا
   * يعرف الطفلُ غيرَ ما سمع.
   */
  const answerIn = (d) => {
    const askEl = d.querySelector('.q-stage[data-ask]');
    if (!askEl) return null;
    const want = askEl.dataset.ask;
    const card = [...d.querySelectorAll('.q-choices .qcard')].find((el) => {
      // **وبطاقةُ المشهد تُعرَف باسمها هي**: فيها صورتان (حاملٌ وشيء) لا صورةٌ واحدة،
      // فاسمُ ما تقوله على البطاقة نفسِها (س٥-٦ — جملةٌ تُطابَق مشهداً).
      if (el.dataset.name) return el.dataset.name === want;
      const fig = el.querySelector('.fig');
      // **وأزرارُ الصوت تُعرَف بصوتها**: جوابُ «الرسمُ ← صوتُه» زرٌّ أعمى لا اسمَ عليه
      return fig && (fig.dataset.name || fig.dataset.word || fig.dataset.sound) === want;
    });
    return card
      || [...d.querySelectorAll('.q-zone')].find((z) => z.dataset.word === want)
      || null;
  };

  let rounds = 0;
  let latin = 0;
  let bareBtns = 0;
  for (let i = 0; i < 12; i++) {
    const found = await waitFor(() => {
      const d = appDoc();
      return d && (answerIn(d) || d.querySelector('.celebrate'));
    }, 15000);
    doc = appDoc();
    if (!found || doc.querySelector('.celebrate')) break;
    /* **ولا يُقاس أثرُ نقرةٍ قبل أن تقع**: الجولةُ تبقى مرسومةً حتى يتمّ الثناءُ
       المنطوق ثم تُستبدَل — فلو قنع الفاحصُ بوجود بطاقةٍ صحيحة لَنقر الجولةَ نفسَها
       اثنتي عشرةَ مرّة وظنّها اثنتي عشرةَ جولة. فالانتظارُ **لتبدّل الساحة** نفسِها. */
    const stageNow = doc.querySelector('.q-stage');
    // **ولا حرفَ إنكليزيّ مكتوب في شاشة الطفل**: المادّةُ تُسمَع ولا تُقرأ، وتوجيهُها
    // عربيّ — فأيُّ حرفٍ لاتينيّ في نصّ الشاشة نقضٌ لقاعدة اللاقراءة بلغتين.
    if (/[A-Za-z]/.test(doc.querySelector('.station-body')?.textContent || '')) latin++;
    bareBtns += [...doc.querySelectorAll('.station-body button')]
      .filter((b) => !b.querySelector('svg, img, .fig') && b.textContent.trim()).length;
    rounds++;
    found.click();
    await waitFor(() => {
      const d = appDoc();
      return d && (d.querySelector('.q-stage') !== stageNow || d.querySelector('.celebrate'));
    }, 15000);
  }

  const celebrate = await waitFor(() => appDoc()?.querySelector('.celebrate'), 15000);
  doc = appDoc();
  ok(rounds >= 7, `وسبعُ جولاتٍ تُلعَب باللمس وحدَه (${rounds} جولة)`);
  ok(latin === 0,
    `**ولا حرفَ إنكليزيّ مكتوب في شاشة الطفل** في أيّ جولة (${latin} خرقاً)`);
  ok(bareBtns === 0, `وكلُّ زرٍّ في الجولة له صورةٌ دالّة (${bareBtns} زرّاً نصّياً)`);
  ok(!!celebrate, 'والمحطةُ تنتهي باحتفالٍ لا بشاشة خطأ');
  const earned = doc.querySelectorAll('.big-stars .on').length;
  ok(earned === 3,
    `**وطفلٌ أصاب كلَّ جولاته يخرج بثلاث نجوم** (${earned})`);
  ok(!doc.querySelector('.station-body progress, .station-body .timer'),
    'ولا مؤقّتَ في الشاشة (`METHOD.md §٤`)');

  // ————— ١٣. كلُّ محطةٍ تكتب قياسَها، ومفاتيحُها مفاتيحُ المنهج —————

  const saved = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  const keys = Object.keys(saved.skills || {});
  const station = curriculum.stations().find((s) => s.id === 'quiz:s1-1');
  ok(keys.length > 0 && keys.every((k) => station.skills.includes(k)),
    `والمحطةُ تكتب قياسَها بمفاتيح المنهج (${keys.length} مفتاحاً من `
    + `${station.skills.length})`);
  ok((saved.stars || {})['quiz:s1-1'] === 3, 'ونجمةُ العقدة مكتوبةٌ بمعرّفها هو');

  // ————— ١٣ب. **وشاشاتُ «اسمع ونفّذ» الثلاث تُقاد كما تُقاد أختُها** —————
  //
  // ثلاثةُ أشكالٍ لا شكل: أمرٌ تُلمَس صورتُه · تفاحةٌ تُوضَع في موضعها · وضعٌ يُختار
  // فاعلُه. **وشكلُ الوضع لا نظيرَ له في اقرأ**، فلا يُصدَّق إلا مقوداً في متصفّح.
  //
  // ويُفتَح طريقُها كما يفتحه طفلٌ أتمّ س١: تُكتب نجومُ محطاتها في التقدّم نفسِه ثم
  // يُعاد تحميلُ الإطار — **لا قفلَ يُلتَفّ عليه في الشيفرة**، والجبهةُ تُحسب كما هي.
  const opened = { ...saved.stars };
  for (const node of curriculum.sections().flatMap((s) => s.nodes))
    if (node.id.startsWith('quiz:s1-')) opened[node.id] = 3;
  win.localStorage.setItem('listen.progress.v1',
    JSON.stringify({ ...saved, stars: opened }));
  frame.contentWindow.location.replace(APP_URL);
  await waitFor(() => appDoc()?.querySelector('.map'), 15000);
  win = frame.contentWindow;
  watchApp(win);
  win.Audio = window.Audio;
  Object.defineProperty(win, 'speechSynthesis', {
    configurable: true, value: { cancel() {}, speak(u) { setTimeout(() => u.onend?.(), 5); } },
  });
  win.SpeechSynthesisUtterance = window.SpeechSynthesisUtterance;

  for (const part of ['s2-1', 's2-2', 's2-3', 's2-4']) {
    win.location.hash = `#/tpr/${part}`;
    const next = await waitFor(() => appDoc()?.querySelector('.station-body .next'), 25000);
    next?.click();
    let played = 0;
    let small = 0;
    for (let i = 0; i < 12; i++) {
      const found = await waitFor(() => {
        const d = appDoc();
        return d && (answerIn(d) || d.querySelector('.celebrate'));
      }, 20000);
      const d = appDoc();
      if (!found || d.querySelector('.celebrate')) break;
      const stageNow = d.querySelector('.q-stage');
      // **وهدفُ اللمس ٦٤ بكسل** (`METHOD.md §٩·٤`): يُقاس على ما يُلمَس فعلاً
      small += [...d.querySelectorAll('.q-choices .qcard, .q-zone')]
        .filter((el) => el.getBoundingClientRect().width < 64
          || el.getBoundingClientRect().height < 64).length;
      played++;
      found.click();
      await waitFor(() => {
        const x = appDoc();
        return x && (x.querySelector('.q-stage') !== stageNow || x.querySelector('.celebrate'));
      }, 20000);
    }
    const done = await waitFor(() => appDoc()?.querySelector('.celebrate'), 20000);
    const marks = appDoc().querySelectorAll('.big-stars .on').length;
    ok(!!done && played >= 7 && marks === 3,
      `ومحطةُ ${part} تُقاد بلمسٍ صحيحٍ إلى ثلاث نجوم (${played} جولة · ${marks} نجوم)`);
    ok(small === 0, `  وهدفُ اللمس فيها ≥٦٤بك في كل جولة (${small} أصغرَ من الحدّ)`);
  }

  const after = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  const tprKeys = Object.keys(after.skills || {}).filter((k) => /tpr-/.test(k));
  const wanted = curriculum.stations()
    .filter((s) => s.type === 'tpr').flatMap((s) => s.skills);
  ok(tprKeys.length > 0 && tprKeys.every((k) => wanted.includes(k)),
    `وقياسُ «اسمع ونفّذ» مكتوبٌ بمفاتيح المنهج (${tprKeys.length} مفتاحاً)`);
  ok(['tpr-do', 'tpr-put', 'tpr-two'].every((kind) => tprKeys.some((k) => k.endsWith(kind))),
    'وأنواعُ أوامرها الثلاثة كلُّها مقيسة (لمسٌ · وضعٌ · أمرٌ مركّب)');

  // ————— ١٣ج. **الخطأ: يُسمَع ما اختار مقابلَ الصواب ثم يمضي** (`METHOD.md §٤`) —————
  //
  // نصُّ المنهج حرفاً، وهو ما يفارق فيه هذا التطبيقُ «اِحْسِبْ» (هناك تُعَدّ الكميةُ
  // **ثم يحاول ثانية**، وهنا يمضي): فيُقاس **الثلاثةُ معاً** — أنّ ما لمسه يُعلَّم
  // خطأً، وأنّ الصوابَ يُضاء معه (التقابلُ هو الدرس)، وأنّ الجولةَ **تمضي** ولا
  // تُحبَس. ويُقاس رابعٌ: أنّ الخطأ كُتب على **المهارة المطلوبة** لا على ما لمس.

  win.location.hash = '#/quiz/s1-2';
  (await waitFor(() => appDoc()?.querySelector('.station-body .next'), 25000))?.click();
  const stepNow = () => appDoc()?.querySelector('.step--now .step-name')?.textContent || '';
  let missTarget = null;
  let missChosen = null;
  let missStage = null;
  for (let i = 0; i < 8; i++) {
    const right = await waitFor(() => answerIn(appDoc()), 20000);
    const d = appDoc();
    if (!right) break;
    const stage = d.querySelector('.q-stage');
    if (stepNow().includes('وَحْدَك')) {
      missTarget = stage.dataset.ask;
      missChosen = [...d.querySelectorAll('.q-choices .qcard')].find((c) => c !== right);
      missStage = stage;
      missChosen?.click();
      break;
    }
    right.click();
    await waitFor(() => appDoc()?.querySelector('.q-stage') !== stage, 20000);
  }

  const marked = await waitFor(() => {
    const d = appDoc();
    return d && d.querySelector('.q-choices .qcard.bad') && d.querySelector('.q-choices .qcard.good')
      ? { bad: d.querySelector('.qcard.bad'), good: d.querySelector('.qcard.good') } : null;
  }, 12000);
  ok(!!missChosen && marked?.bad === missChosen,
    'وخطأُ الطفل يُعلَّم على ما لمس هو');
  ok(marked?.good?.querySelector('.fig')?.dataset.word === missTarget,
    `**ويُضاء الصوابُ معه** فيقع التقابل («${missTarget ?? '—'}»)`);
  const moved = await waitFor(() => appDoc()?.querySelector('.q-stage') !== missStage, 20000);
  ok(!!moved, '**ثم تمضي الجولة** — لا حبسَ ولا إعادةَ محاولةٍ على كلمةٍ لم تثبت بعد');

  const afterMiss = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  const missed = (afterMiss.skills || {})[`word|${missTarget}|listen-pick`];
  ok(missed && missed.wrong >= 1 && missed.box === 0,
    'والخطأ مكتوبٌ على **المهارة المطلوبة** وصندوقُها عاد صفراً (تعود غداً)');

  // ————— ١٤. **حارسُ اللاقراءة مُجرَّبٌ سالباً** (شرطُ بند الجلسة) —————
  //
  // «لا يُصدَّق حارسٌ لم يُرَ وهو يمسك»: يُدسّ **زرٌّ نصّيّ مصنوع** في شاشة الطفل
  // فيجب أن يُمسَك، ثم يُرفَع فتعود الشاشةُ نظيفة. ولولا هذه الدسّة لَكان خضارُ
  // الحارس أعلاه شهادةً على أنّه **لا يرى** لا على أنّ الشاشة سليمة.

  const jard = () => [...appDoc().querySelectorAll('.screen button')]
    .filter((b) => !b.closest('.dev') && !b.querySelector('svg, img, .fig') && b.textContent.trim());
  // **والمستندُ يُقرأ حين يُقاس لا قبله**: أُعيد تحميلُ الإطار بين الفحصين، فمستندٌ
  // مُمسَكٌ من قبلُ **مقطوعٌ من الصفحة** — تُدسّ فيه الدسّةُ فلا يراها أحد، ويُقرأ
  // ذلك «الحارسُ لا يمسك» وهو يمسك. (وهو عينُ درسِ `onScreen`: ما ليس على الصفحة
  // لا يُقاس.)
  doc = appDoc();
  ok(jard().length === 0, 'وجردُ أزرار الشاشة نظيفٌ قبل الدسّة');
  const planted = doc.createElement('button');
  planted.className = 'btn';
  planted.textContent = 'اِضْغَطْ هُنَا';
  doc.querySelector('.screen-card').append(planted);
  const caught = jard();
  ok(caught.length === 1 && caught[0] === planted,
    '**وزرٌّ نصّيٌّ مصنوع يُدسّ فيُمسَك** — حارسُ اللاقراءة يرى فعلاً');
  planted.remove();
  ok(jard().length === 0, 'ويُرفَع فتعود الشاشةُ نظيفة');

  // ————— ١٥. **مسارُ الأذن كلُّه يُقاد كما يقوده طفل** (معيارُ قبول الجلسة ٣) —————
  //
  // ثمانِ محطاتٍ بستّة أشكال: زوجٌ مصوَّر يُلمَس · صوتان يُميَّزان («أهما سواء؟») ·
  // أوّلُ الصوت · الدمجُ الشفهي · **التقطيعُ الشفهي** (أزرارٌ صوتيةٌ تُرتَّب — لا
  // نظيرَ له في اقرأ ولا في احسب) · القافية. ولا يُصدَّق شيءٌ من ذلك من لقطة.
  //
  // **والقفلُ لا يُلتَفّ عليه**: تُفتَح المحطاتُ كما يفتحها طفل — بإتمام ما قبلها
  // (نجومُ س٢ كُتبت بقيادتها أعلاه، فصارت س٣ على الجبهة).

  /**
   * أزرارُ الترتيب إن كانت الجولةُ جولةَ ترتيب — وحالُها مُعلَنةٌ في `data-ready`.
   *
   * **وشكلان لا شكل**: أصواتُ التقطيع (س٤-٣ — تُعرَف بـ`data-sound`) **ولبناتُ الدمج**
   * (ح٢+ — رسومٌ تُعرَف بـ`data-word`). ميكانيكيّتُهما واحدة: صفٌّ يُبنى من اليسار
   * بلمساتٍ مرتَّبة، فلا يُكتب له سائقان.
   */
  const orderIn = (d) => {
    const stage = d.querySelector('.q-stage[data-order]');
    if (!stage) return null;
    const sounds = [...d.querySelectorAll('.q-choices--sounds .qcard--sound')];
    const letters = [...d.querySelectorAll('.q-choices--letters .qcard--letter')];
    return {
      stage,
      ready: stage.dataset.ready === '1',
      want: stage.dataset.order.split(' '),
      key: letters.length ? 'word' : 'sound',
      pick: letters.length ? '.q-choices--letters .qcard--letter'
        : '.q-choices--sounds .qcard--sound',
      tray: letters.length ? '.q-tray--letters .qcard--letter'
        : '.q-tray--sounds .qcard--sound',
      btns: letters.length ? letters : sounds,
    };
  };

  /**
   * أيمكن الجواب الآن؟ (بطاقةٌ تُلمَس، أو أزرارُ ترتيبٍ فُتحت)
   *
   * **والقفلُ يُحترَم حيث أُعلن**: شاشةُ «الرسمُ ← صوتُه» تُعرِّف أزرارَها بإسماعها ثم
   * تفتحها (`data-ready`) — فلمسةٌ قبلها يبتلعها القفل ويُقرأ ذلك «لا جواب».
   */
  const readyIn = (d) => {
    if (!d) return null;
    const seq = orderIn(d);
    if (seq) return seq.ready ? seq : null;
    const gated = d.querySelector('.q-stage[data-ready]');
    if (gated && gated.dataset.ready !== '1') return null;
    return answerIn(d);
  };

  /**
   * يلعب جولةً واحدة: يلمس الصوابَ — أو **خطأً مقصوداً** حين يُطلَب (للبوابة).
   * ويُرجِع `true` إن وقع لمسٌ فعلاً.
   */
  async function answerNow(d, wrong = false, onPlace = null) {
    const seq = orderIn(d);
    if (seq) {
      const free = () => [...d.querySelectorAll(seq.pick)];
      const at = (want) => free().find((b) => b.querySelector('.fig')?.dataset[seq.key] === want);
      if (wrong) {
        const bad = free().find((b) => b.querySelector('.fig')?.dataset[seq.key] !== seq.want[0]);
        (bad || free()[0]).click();
        return true;
      }
      for (const want of seq.want) {
        const btn = await waitFor(() => {
          const now = appDoc();
          const stage = now?.querySelector('.q-stage[data-order]');
          return stage && stage.dataset.ready === '1' ? at(want) : null;
        }, 20000);
        if (!btn) return false;
        btn.click();
        // **ويُقاس الصفُّ فورَ اللمسة**: النقلُ إلى صفّ الترتيب يقع في المُنصِت نفسِه
        // قبل أيّ انتظار، فهذه اللحظةُ هي التي يُرى فيها ما بناه الطفل.
        onPlace?.(d, seq);
      }
      return true;
    }
    const right = answerIn(d);
    if (!right) return false;
    if (!wrong) { right.click(); return true; }
    const other = [...d.querySelectorAll('.q-choices .qcard')].find((c) => c !== right);
    (other || right).click();
    return true;
  }

  /**
   * يقود محطةً من أوّلها إلى احتفالها كما يقودها طفل، ويقيس في كل جولة:
   * حرفاً لاتينياً في شاشة الطفل · زرّاً نصّياً · هدفَ لمسٍ دون ٦٤بك.
   */
  /**
   * **حرفٌ لاتينيٌّ خارج `.en`** — قاعدةُ اللاقراءة بلغتين في مسار الحرف: الرسمُ
   * **مادّةُ فكٍّ مقصودة** يُعرَض معزولاً `ltr` بخطّ المادّة (`METHOD.md §٩·٣`)، وما
   * سواه من لاتينيٍّ في شاشة الطفل خرقٌ. فيُنزَع المعزولُ ويُقاس الباقي.
   */
  const looseLatin = (d) => {
    const body = d.querySelector('.station-body');
    if (!body) return 0;
    const bare = body.cloneNode(true);
    for (const el of bare.querySelectorAll('.en')) el.remove();
    return /[A-Za-z]/.test(bare.textContent || '') ? 1 : 0;
  };

  async function driveStation(hash, onPlace = null, watch = null) {
    win.location.hash = hash;
    const onward = await waitFor(() => appDoc()?.querySelector('.station-body .next'), 30000);
    onward?.click();
    const seen = { rounds: 0, latin: 0, loose: 0, bare: 0, small: 0, opened: !!onward };
    for (let i = 0; i < 14; i++) {
      const found = await waitFor(() => {
        const d = appDoc();
        return d && (readyIn(d) || d.querySelector('.celebrate'));
      }, 25000);
      const d = appDoc();
      if (!found || d.querySelector('.celebrate')) break;
      const stageNow = d.querySelector('.q-stage');
      watch?.(d);
      seen.loose += looseLatin(d);
      if (/[A-Za-z]/.test(d.querySelector('.station-body')?.textContent || '')) seen.latin++;
      seen.bare += [...d.querySelectorAll('.station-body button')]
        .filter((b) => !b.querySelector('svg, img, .fig') && b.textContent.trim()).length;
      seen.small += [...d.querySelectorAll('.q-choices .qcard, .q-zone')]
        .filter((el) => el.getBoundingClientRect().width < 64
          || el.getBoundingClientRect().height < 64).length;
      seen.rounds++;
      if (!await answerNow(d, false, onPlace)) break;
      await waitFor(() => {
        const x = appDoc();
        return x && (x.querySelector('.q-stage') !== stageNow || x.querySelector('.celebrate'));
      }, 25000);
    }
    await waitFor(() => appDoc()?.querySelector('.celebrate'), 25000);
    seen.stars = appDoc().querySelectorAll('.big-stars .on').length;
    seen.done = !!appDoc().querySelector('.celebrate');
    return seen;
  }

  /**
   * **شكلُ صفٍّ من بطاقاتٍ**: أفي سطرٍ واحد؟ أيتقدّم من اليسار؟ أفيه هدفُ لمسٍ انكمش؟
   *
   * **ويُقاس بمركز البطاقة لا بأعلاها** (إصلاحُ الجلسة ص، وعلّتُه مقيسة): البطاقةُ
   * تُنقَل إلى الصفّ **ثم تثب فرحاً** (`pop` في `ui.js` — `scale(1.12)` عند ٤٠٪ من
   * ٢٢٠ملّي)، والصفُّ `align-items: center`. فبطاقةٌ في وثبتها ارتفاعُها ٨٩٫٦بك بدل
   * ٨٠، **وأعلاها يعلو ٤٫٨بك** عن أخواتها — وحدُّ التسامح كان ٤. فكان الحارسُ يقول
   * «يتراصّ عموداً» عن صفٍّ مستوٍ، **وإنّما التقط لحظةَ الوثبة**؛ ويقع ذلك أو لا يقع
   * بحسب متى بدأت الحركةُ في هذا الإطار — وهو ما بدّله وصولُ بنك الصوت (زمنُ الملفّ
   * المسموع غيرُ زمن الاحتياط). **والمركزُ لا تزحزحه وثبةٌ**: المتمدّدُ يتمدّد
   * حولَه، فيقيس الحارسُ ما أراد (سطرٌ واحد) لا ما لم يُرِد (لحظةُ حركة).
   *
   * **ومقاسُ اللمس من التخطيط لا من المرسوم** (`offsetWidth`): الوثبةُ تكبّر المرسومَ
   * فتخفي زرّاً انكمش في تخطيطه — والعهدُ عهدُ تخطيطٍ (‏٦٤بك هدفُ إصبع).
   */
  const rowShape = (set) => {
    const box = set.map((el) => el.getBoundingClientRect());
    const mid = box.map((b) => b.top + b.height / 2);
    const spread = Math.max(...mid.map((m) => Math.abs(m - mid[0])));
    return {
      row: spread < 4,
      ltr: box.every((b, i) => i === 0 || b.left > box[i - 1].left),
      small: set.filter((el) => el.offsetWidth < 64 || el.offsetHeight < 64).length,
      // **والشاردُ يُسمّى لا يُعَدّ**: قياسٌ يسقط يقول بكم سقط وفي صفٍّ من كم —
      // فلا يُقرأ «يتراصّ عموداً» عن فرقِ بضعِ بكسلاتٍ في لحظة حركة.
      spread: Math.round(spread * 10) / 10,
      n: set.length,
      hs: [...new Set(set.map((el) => el.offsetHeight))].join('/'),
    };
  };
  /** وصفُ أسوأ قياسٍ سقط — يُلحَق برسالة الفشل فيُقرأ سببُه لا رقمُه. */
  const worstRow = (rows) => {
    const bad = rows.filter((r) => !r.row).sort((a, b) => b.spread - a.spread)[0];
    return bad ? ` (أسوأُ فرقٍ ${bad.spread}بك في صفٍّ من ${bad.n}، ارتفاعاتُها ${bad.hs}بك)` : '';
  };

  /* **ومحطاتُ المرحلة تُقاد كما يعلنها المنهجُ لا كما تُكتب هنا** (حسمُ أ-٣/أ-٤):
     كانت أسماؤها مكتوبةً في هذا السطر، فلمّا وُلدت محطةٌ في المرحلة **بقيت غيرَ
     مقودة — والقفلُ التسلسليّ يقف عندها**، فسقط كلُّ ما بعدها في هذه الصفحة
     صفراً (بوابةٌ بلا تمارين، ودرجاتٌ بلا جولات) ولا عيبَ في التطبيق. فصارت
     تُقرأ من `stations()` بترتيبها: تُولَد المحطةُ فتُقاد يومَ تُولَد. */
  const partsOf = (stage) => curriculum.stations()
    .filter((t) => t.stage === stage).map((t) => t.part);

  for (const part of partsOf('listen3')) {
    const seen = await driveStation(`#/contrast/${part}`);
    ok(seen.done && seen.rounds >= 7 && seen.stars === 3,
      `ومحطةُ «ميّز الزوجين» ${part} تُقاد إلى ثلاث نجوم (${seen.rounds} جولة · ${seen.stars} نجوم)`);
    ok(seen.latin === 0 && seen.bare === 0 && seen.small === 0,
      `  وبلا حرفٍ لاتينيّ ولا زرٍّ نصّيّ، وهدفُ اللمس ≥٦٤بك`
      + ` (${seen.latin}/${seen.bare}/${seen.small})`);
  }

  // **والشكلُ من البيانات لا من المعرّف**: س٣-٢ زوجٌ صوتيٌّ خالص (لا زوجَ أدنى مصوَّراً
  // له في الرصيد)، فجوابُه شكلان لا صورتان — ويُقاس ذلك في الشاشة الحيّة.
  const soundPairs = curriculum.stations()
    .filter((s) => s.type === 'contrast').flatMap((s) => s.pairs)
    .filter((p) => p.mode === 'sound');
  ok(soundPairs.length > 0 && soundPairs.every((p) => p.sounds.length === 2 && p.why),
    `و${soundPairs.length} أزواجٍ صوتيةٍ خالصة، لكلٍّ صوتاه وعلّتُه المكتوبة`);

  /* **وصفُّ الترتيب يُقاس هندسةً لا نيّة** (عيبٌ أُمسك ساعةَ كُتب): قاعدةُ الصفّ
     وقاعدةُ صينيّة س٢-٢ بدرجةِ ترجيحٍ واحدة، فسبقُ إحداهما يقلب الصفَّ **عموداً**
     والزرَّ المنقولَ **أصغرَ** — ولا يُمسَك ذلك بجردٍ ولا بنصّ، يُمسَك بقياس ما رُسم:
     أزرارُ الترتيب في **سطرٍ واحد**، تتقدّم **من اليسار** (`METHOD.md §٩·٣`)،
     وكلُّ زرٍّ ≥٦٤بك في صفّه كما كان في مكانه. */
  const trayRows = [];
  for (const part of partsOf('listen4')) {
    const seen = await driveStation(`#/ear/${part}`, (d) => {
      const set = [...d.querySelectorAll('.q-tray--sounds .qcard--sound')];
      if (set.length < 2) return;
      trayRows.push(rowShape(set));
    });
    ok(seen.done && seen.rounds >= 7 && seen.stars === 3,
      `ومحطةُ «الأذن الفونيمية» ${part} تُقاد إلى ثلاث نجوم (${seen.rounds} جولة · ${seen.stars} نجوم)`);
    ok(seen.latin === 0 && seen.bare === 0 && seen.small === 0,
      `  وبلا حرفٍ لاتينيّ ولا زرٍّ نصّيّ، وهدفُ اللمس ≥٦٤بك`
      + ` (${seen.latin}/${seen.bare}/${seen.small})`);
  }
  ok(trayRows.length > 0 && trayRows.every((r) => r.row && r.ltr && !r.small),
    `**وصفُّ التقطيع سطرٌ واحد يتقدّم من اليسار** (${trayRows.length} قياساً`
    + `، وكلُّ زرٍّ فيه ≥٦٤بك)`
    + (trayRows.some((r) => !r.row) ? ' — **يتراصّ عموداً**' + worstRow(trayRows) : '')
    + (trayRows.some((r) => !r.ltr) ? ' — **يتقدّم من اليمين**' : '')
    + (trayRows.some((r) => r.small) ? ' — **زرٌّ انكمش بانتقاله**' : ''));

  const earState = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  const earKeys = Object.keys(earState.skills || {});
  const earWanted = curriculum.stations()
    .filter((s) => ['contrast', 'ear'].includes(s.type)).flatMap((s) => s.skills);
  const written = earKeys.filter((k) => earWanted.includes(k));
  ok(written.length > 0 && written.every((k) => earWanted.includes(k)),
    `وقياسُ س٣ وس٤ مكتوبٌ بمفاتيح المنهج (${written.length} مفتاحاً)`);
  ok(['pair', 'phon', 'oral', 'rhyme'].every((unit) =>
    written.some((k) => k.startsWith(`${unit}|`))),
    'ووحداتُه الأربع كلُّها مقيسة (الزوجُ · أوّلُ الصوت · الدمجُ والتقطيعُ · القافية)');
  ok(['pick', 'blend-ear', 'segment-ear'].every((kind) =>
    written.some((k) => k.endsWith(`|${kind}`))),
    'وأنواعُ تمارينها الثلاثة كلُّها مكتوبة في ليتنر');

  // ————— ١٦. **المراجعةُ اليومية**: بابُها من الخريطة، ومادّتُها من الحصيلة —————
  //
  // «المراجعةُ اليومية تسحب من الجبهتين معاً» (`METHOD.md §٧`) — **وجبهتُنا اليومَ
  // سمعيةٌ واحدة**: مسارُ الحرف لم يُفتَح بعد (ق٤)، والثانيةُ تُفتَح في جلسته.

  win.location.hash = '#/';
  await waitFor(() => appDoc()?.querySelector('.map'));
  const reviewCard = appDoc().querySelector('.continue--review');
  ok(!!reviewCard, 'وبطاقةُ «مراجعة اليوم» ظهرت على الخريطة حين صار للطفل حصيلة');
  reviewCard?.click();
  const reviewScreen = await waitFor(() => appDoc()?.querySelector('.dots'), 25000);
  ok(!!reviewScreen, 'وبابُها من الخريطة يفتح جلسةً حقيقية');
  const reviewBefore = Object.keys(JSON.parse(
    win.localStorage.getItem('listen.progress.v1') || '{}').skills || {}).length;
  let reviewRounds = 0;
  for (let i = 0; i < 10; i++) {
    const found = await waitFor(() => {
      const d = appDoc();
      return d && (readyIn(d) || d.querySelector('.celebrate'));
    }, 25000);
    const d = appDoc();
    if (!found || d.querySelector('.celebrate')) break;
    const stageNow = d.querySelector('.q-stage');
    reviewRounds++;
    if (!await answerNow(d)) break;
    await waitFor(() => {
      const x = appDoc();
      return x && (x.querySelector('.q-stage') !== stageNow || x.querySelector('.celebrate'));
    }, 25000);
  }
  const reviewDone = await waitFor(() => appDoc()?.querySelector('.celebrate'), 25000);
  ok(!!reviewDone && reviewRounds >= 5,
    `وتُقاد ستةُ تمارينَ من حصيلته إلى ختامها (${reviewRounds} تمريناً)`);
  const afterReview = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  ok(Object.keys(afterReview.reviews || {}).length > 0,
    'ومراجعةُ اليوم مسجَّلةٌ بمحاولاتها (وحدةُ لوحة الوالد نفسُها)');
  ok(Object.keys(afterReview.skills || {}).length >= reviewBefore,
    'وكلُّ تمرينٍ فيها يكتب قياسَه على مفاتيحه');

  // ————— ١٧. 🚪 **بوابةُ الأذن**: إخفاقٌ يعيد بلا رسوب، ثم عبورٌ يفتح ما بعدها —————
  //
  // نصُّ المنهج (`METHOD.md §٤`): «من **أضعف** مهارات س١–س٤ (إصابة ≥٨٠٪، **لا رسوب**)»،
  // **واجتيازُها شرطُ فتح مسار الحرف** (ق٤ · `METHOD.md §٦`). فيُقاس الطرفان في
  // متصفّحٍ حقيقيّ: **إخفاقٌ محاكى** (ثلاثةُ أخطاء في عشرة = ٧٠٪) ثم **عبورٌ**.

  win.location.hash = '#/gate/ear';
  const gateScreen = await waitFor(() => appDoc()?.querySelector('.gate-head'), 25000);
  ok(!!gateScreen, '🚪 بوابةُ «عبورِ الأذن» تُفتَح بعد س٤ (والقفلُ التسلسليّ فتحها)');
  ok(appDoc().querySelectorAll('.dots li').length === 10,
    `وتمارينُها عشرة (${appDoc().querySelectorAll('.dots li').length})`);

  /** يقود جلسةَ بوابةٍ: أوّلُ `misses` تمارينَ خطأً عمداً، وما بعدها صواب. */
  async function driveGate(misses) {
    const asks = [];
    for (let i = 0; i < 12; i++) {
      const found = await waitFor(() => {
        const d = appDoc();
        return d && (readyIn(d) || d.querySelector('.celebrate'));
      }, 25000);
      const d = appDoc();
      if (!found || d.querySelector('.celebrate')) break;
      const stageNow = d.querySelector('.q-stage');
      asks.push(stageNow?.dataset.ask || '');
      if (!await answerNow(d, i < misses)) break;
      await waitFor(() => {
        const x = appDoc();
        return x && (x.querySelector('.q-stage') !== stageNow || x.querySelector('.celebrate'));
      }, 25000);
    }
    await waitFor(() => appDoc()?.querySelector('.celebrate'), 25000);
    return asks;
  }

  const firstAsks = await driveGate(3);
  let doc2 = appDoc();
  ok(firstAsks.length === 10, `وتُقاد عشرةَ تمارين (${firstAsks.length})`);
  ok(!!doc2.querySelector('.celebrate--again'),
    '**وإخفاقُها «ليس بعدُ» لا رسوب** (٧٠٪ دون العتبة)');
  ok(!/رسوب|فشل|خسر/.test(doc2.body.textContent),
    'ولا لفظَ رسوبٍ ولا فشلٍ في شاشتها');
  const gateData = curriculum.gateById('ear');
  ok(doc2.body.textContent.includes(gateData.again),
    `ونصُّ تشجيعها **من بيان البوابة** لا مكتوباً في الشيفرة («${gateData.again}»)`);
  const midStars = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}').stars || {};
  ok(!midStars['gate:ear'], 'ولا نجمةَ تُكتب لبوابةٍ لم تُعبَر');

  const retry = [...doc2.querySelectorAll('.celebrate button')]
    .find((b) => /أعِد/.test(b.textContent));
  retry?.click();
  await waitFor(() => appDoc()?.querySelector('.q-stage'), 25000);
  doc2 = appDoc();
  ok(doc2.querySelector('.station-screen')?.dataset.tries === '2',
    '**وإعادتُها تبني تمارينَها من جديد** (لا نمطَ يُحفَظ فيُستظهَر)');
  const secondAsks = await driveGate(0);
  ok(secondAsks.join('|') !== firstAsks.join('|'),
    'وتمارينُ الإعادة غيرُ تمارين المحاولة الأولى');
  doc2 = appDoc();
  ok(!!doc2.querySelector('.celebrate') && !doc2.querySelector('.celebrate--again'),
    '**وعبورُها بإصابةٍ تامّة يفتحها** (١٠٠٪ فوق العتبة)');
  const gateStars = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}').stars || {};
  ok(gateStars['gate:ear'] > 0, 'ونجمةُ البوابة مكتوبةٌ بمعرّفها هو');

  // **واجتيازُها هو فتحُ مسار الحرف نفسِه** (ق٤): لا شيفرةَ خاصّةَ به — القفلُ
  // التسلسليّ يفعله، فأوّلُ عقدةِ حرفٍ صارت مفتوحةً على الخريطة.
  win.location.hash = '#/';
  await waitFor(() => appDoc()?.querySelector('.map'));
  doc2 = appDoc();
  const afterGate = curriculum.sections()
    .flatMap((s) => s.nodes).find((n) => n.type === 'grade' || n.type === 'cluster');
  const gradeBtn = [...doc2.querySelectorAll('.node')]
    .find((b) => (b.getAttribute('aria-label') || '').startsWith(afterGate.title));
  ok(!!gradeBtn && !gradeBtn.classList.contains('node--locked'),
    `**وأوّلُ درجةِ حرفٍ («${afterGate.title}») صارت مفتوحة** — فتحُ مسار الحرف `
    + 'هو اجتيازُ البوابة نفسُه (ق٤)، والقفلُ التسلسليّ يفعله بلا شيفرةٍ خاصة');

  // ————— ١٨. **مسارُ الحرف يُقاد كما يقوده طفل** (معيارُ قبول الجلسة ٤) —————
  //
  // خمسُ درجاتٍ بخمسة أشكال: صوتٌ يُسمَع فيُلمَس رسمُه · رسمٌ يُرى فيُلمَس صوتُه ·
  // **لبناتٌ تُركَّب كلمةً تُسمَع** · كلمةٌ تُفكّ فتُلمَس صورتُها · شائكةٌ بقلب شوكتها.
  // وهذه أوّلُ شاشاتٍ يقع فيها تحت بصر الطفل حرفٌ إنكليزيّ، فلا يُصدَّق شيءٌ منها
  // من لقطة.
  //
  // **وحالُ ليتنر تُصنَع بيد**: قيدُ الاقتران يمنع كلَّ كلمةِ قراءةٍ لم تنضج سمعاً،
  // فتُرفَع مفاتيحُ ح١–ح٥ السمعية إلى صندوق الإتقان — **إلا واحدةً مدسوسة** تُترك
  // دونه، وهي شاهدُ القيد في الشجرة الحية (الفحصُ ١٨هـ).

  // **والعهدان معاً** (الجلسة ٥): ح١–ح٥ ثم ح٦–ح١٢ — اثنتا عشرةَ درجةً تُقاد بأشكالها.
  const GRADE_PARTS = ['h01', 'h02', 'h03', 'h04', 'h05',
    'h06', 'h07', 'h08', 'h09', 'h10', 'h11', 'h12'];
  const ERA_ONE = 5;                       // ح١–ح٥ ثم 🚪٢ ثم ح٦–ح١٢ (ترتيبُ الرحلة)
  // **وكلماتُ الرحلة كلِّها تنضج** (الجلسة ٧: ح١٤–ح١٦ وقصصُها تُقاد كذلك)
  const gradeWords = curriculum.GRADES
    .flatMap((g) => g.words.map((w) => ({ ...w, grade: g.id })));
  const held = gradeWords.find((w) => w.w === 'hat') || gradeWords.at(-1);
  const before = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  const ripe = (box) => ({ right: box, wrong: 0, box, due: 0, seen: 0, since: 0 });
  const grown = { ...(before.skills || {}) };
  for (const word of gradeWords) grown[word.listen] = ripe(4);
  /* **وشائكاتُ المدخل تنضج معها** (الجلسة ٧): صارت لها محطاتٌ سمعية (جملُ س٥-٦)،
     فقصةُ ح١٠ فيها `her` و`they` وقصّةُ ح١٤ فيها `their` — وقيدُ الاقتران يحبس
     القصةَ كلَّها حتى تنضج. (والشاهدُ السالب أدناه يحذف مفتاحَ شائكته بيده.) */
  for (const shape of Object.values(curriculum.HEART_WORDS)) {
    if (shape.listen) grown[shape.listen] = ripe(4);
  }
  // **والمدسوسةُ قِيست ولم تبلغ**: الصندوقُ ٢ دون عتبة الإتقان (٣) — لا صفرٌ يُظنّ غياباً
  grown[held.listen] = ripe(2);
  /* **وما يُقاد لا يُفتَح بيد**: مسارُ السمع كلُّه يُملأ نجوماً ليصير مسارُ الحرف على
     الجبهة، **وعقدُ مسار الحرف كلُّها تُقاد كما يقودها طفل** — درجاتُه وبواباتُه
     **وقصّتُه ودرجةُ عناقيده** (الجلسة ٦): فلو مُلئت نجوماً لَما شهد الفحصُ أنّ
     القفل التسلسليّ يمرّ بها، وهي أوّلُ عقدةِ قصةٍ في الرحلة. */
  const DRIVEN = new Set(['grade', 'gate', 'cluster', 'story']);
  const openStars = { ...(before.stars || {}) };
  for (const node of curriculum.sections().flatMap((s) => s.nodes)) {
    if (!DRIVEN.has(node.type)) openStars[node.id] = 3;
  }
  win.localStorage.setItem('listen.progress.v1',
    JSON.stringify({ ...before, skills: grown, stars: openStars }));

  /**
   * إعادةُ تحميل الإطار على تقدّمٍ كُتب — **وتنتظر مستنداً جديداً لا علامةً قد تكون
   * قائمة**.
   *
   * **وهو عيبٌ أُمسك ساعةَ كُتب**: التنقّلُ لا يُبدّل مستندَ الإطار في الحال، فلو كان
   * المعروضُ **خريطةً** قبل الإعادة لَأجاب `waitFor('.map')` من المستند **القديم** —
   * فيُوضَع فيه ثبتُ الصوت ويُضبَط فيه المسار، ثم يجيء المستندُ الجديد فيمحو ذلك كلَّه
   * ويقف عند الخريطة. (وأختُه في الفحص ١٣ب لم تقع لأنّ المعروضَ قبلها كان احتفالاً لا
   * خريطة — وهو فرقٌ لا يُعتمَد عليه.) فيُطبَع القديمُ ويُنتظَر **مستندٌ بلا طابع**.
   */
  const reopen = async () => {
    const stale = appDoc();
    if (stale) stale.documentElement.dataset.stale = '1';
    frame.contentWindow.location.replace(APP_URL);
    await waitFor(() => {
      const d = appDoc();
      return d && !d.documentElement.dataset.stale && d.querySelector('.map') ? d : null;
    }, 15000);
    win = frame.contentWindow;
    watchApp(win);
    win.Audio = window.Audio;
    Object.defineProperty(win, 'speechSynthesis', {
      configurable: true, value: { cancel() {}, speak(u) { setTimeout(() => u.onend?.(), 5); } },
    });
    win.SpeechSynthesisUtterance = window.SpeechSynthesisUtterance;
  };
  await reopen();

  /** كلُّ ما رُسم أو سُئل عنه في مسار الحرف — مادّةُ شاهد قيد الاقتران. */
  const shownWords = new Set();
  const watchLetters = (d) => {
    for (const fig of d.querySelectorAll('.station-body .fig[data-word]')) {
      if (fig.dataset.word) shownWords.add(fig.dataset.word);
    }
    const ask = d.querySelector('.q-stage[data-ask]')?.dataset.ask;
    if (ask) shownWords.add(ask);
    for (const g of d.querySelectorAll('.station-body .glyph-g')) {
      materialFonts.add(win.getComputedStyle(g).fontFamily.split(',')[0].replace(/["']/g, ''));
    }
  };

  const letterRows = [];
  let pendingSeen = 0;
  // خطُّ المادّة كما يُحسَب فعلاً على الرسم المعروض (لا كما يُعلَن في اللوح)
  const materialFonts = new Set();
  /* **ومحطةُ عودة الأذن تُقاد في موضعها من مسار الحرف** (حسمُ أ-٣ ب): الزوجُ يعود
     مقيساً عند درجة رمزه، **وهي عقدةٌ في الخريطة كسائرها** — فلو تُركت لَوقف القفلُ
     التسلسليّ عندها ولم يُفتَح ما بعدها. وتُقرأ من المنهج لا تُكتب هنا. */
  const driveReturn = async (part) => {
    const back = curriculum.stations().find((t) => t.id === `contrast:${part}-again`);
    if (!back) return;
    const seen = await driveStation(`#/contrast/${part}-again`);
    ok(seen.done && seen.rounds >= 5 && seen.stars === 3,
      `🔁 **وعودةُ الأذن عند ${part} تُقاد إلى ثلاث نجوم** («${back.title}» — `
      + `${seen.rounds} جولة · ${seen.stars} نجوم)`);
    ok(seen.latin === 0 && seen.bare === 0 && seen.small === 0,
      `  وبلا حرفٍ لاتينيّ ولا زرٍّ نصّيّ، وهدفُ اللمس ≥٦٤بك`
      + ` (${seen.latin}/${seen.bare}/${seen.small})`);
  };

  for (const part of GRADE_PARTS.slice(0, ERA_ONE)) {
    // **وهي `measureTray` نفسُها** (تُعرَّف أدناه لدرجات ما بعد العهد الأول): كُتبت
    // مرّتين فأُصلحت إحداهما وبقيت الأخرى — فوُحِّدتا على `rowShape` (الجلسة ص).
    const seen = await driveStation(`#/grade/${part}`, (d) => {
      const set = [...d.querySelectorAll('.q-tray--letters .qcard--letter')];
      if (set.length < 2) return;
      letterRows.push(rowShape(set));
    }, (d) => {
      watchLetters(d);
      pendingSeen += d.querySelectorAll('.station-body .fig-letters[data-pending]').length;
    });
    ok(seen.done && seen.rounds >= 7 && seen.stars === 3,
      `ودرجةُ الحرف ${part} تُقاد إلى ثلاث نجوم (${seen.rounds} جولة · ${seen.stars} نجوم)`);
    ok(seen.loose === 0 && seen.bare === 0 && seen.small === 0,
      `  **ولا حرفٍ لاتينيٍّ خارج \`.en\` المعزول**، ولا زرٍّ نصّيّ، وهدفُ اللمس ≥٦٤بك`
      + ` (${seen.loose}/${seen.bare}/${seen.small})`);
    await driveReturn(part);
  }

  // ————— ١٨ب. 🚪 **بوابةُ عبور الفكّ تقف بين العهدين — كما يمرّ بها الطفل** —————
  //
  // **وموضعُها في الفحص موضعُها في الرحلة**: القفلُ التسلسليّ يجعل ح٦ خلفَ البوابة،
  // فسَوقُ العهد الثاني قبل عبورها يقود إلى **بابٍ مغلق** — وهو ما وقع في أوّل تشغيلٍ
  // للجلسة ٥ (سبعُ درجاتٍ «صفرُ جولة»)، وأمسكه التقريرُ المسمّي في أوّل جولة.
  //
  // **وإخفاقُها يعيد بلا رسوب ثم تُعبَر**: «CVC بالمجموعات الخمس + الشائكات الخمس،
  // **من أضعف ح١–ح٥**» (`METHOD.md §٥`) — ومدَاها معلَنٌ في البيان (`gateSkills`)،
  // فلا يتصدّر جلستَها ضعفٌ في السمع.

  win.location.hash = '#/gate/decode';
  const decodeGate = await waitFor(() => appDoc()?.querySelector('.gate-head'), 25000);
  ok(!!decodeGate, '🚪 بوابةُ «عبورِ الفكّ» تُفتَح بعد تمام العهد الأول');
  const gateAsks = await driveGate(3);
  let gateDoc = appDoc();
  ok(gateAsks.length === 10, `وتُقاد عشرةَ تمارين (${gateAsks.length})`);
  ok(!!gateDoc.querySelector('.celebrate--again'),
    '**وإخفاقُها «ليس بعدُ» لا رسوب** (٧٠٪ دون العتبة)');
  const decodeGateData = curriculum.gateById('decode');
  ok(gateDoc.body.textContent.includes(decodeGateData.again),
    `ونصُّ تشجيعها من بيانها هو («${decodeGateData.again}»)`);
  ok(!(JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}').stars
    || {})['gate:decode'], 'ولا نجمةَ تُكتب لبوابةٍ لم تُعبَر');

  [...gateDoc.querySelectorAll('.celebrate button')]
    .find((b) => /أعِد/.test(b.textContent))?.click();
  await waitFor(() => appDoc()?.querySelector('.q-stage'), 25000);
  await driveGate(0);
  gateDoc = appDoc();
  ok(!!gateDoc.querySelector('.celebrate') && !gateDoc.querySelector('.celebrate--again'),
    '**وعبورُها بإصابةٍ تامّة يفتحها** (١٠٠٪ فوق العتبة)');
  const decodeStars = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}').stars || {};
  ok(decodeStars['gate:decode'] > 0, 'ونجمةُ البوابة مكتوبةٌ بمعرّفها هو');


  // ————— ١٨ج. **والعهدُ الثاني بعدها**: سبعُ درجاتٍ برموزها وعللها، وقصّتُها في موضعها —————

  const measureTray = (d) => {
    const set = [...d.querySelectorAll('.q-tray--letters .qcard--letter')];
    if (set.length < 2) return;
    letterRows.push(rowShape(set));
  };

  /* **وسطرُ القصة يُقاس هندسةً كما يُقاس صفُّ الدمج** (`METHOD.md §٩·٣`): سطرٌ واحد
     يتقدّم **من اليسار** ومعه مؤشّرُ بدء السطر — والدرسُ دُفع ثمنُه مرّتين قبله. */
  const lineRows = [];
  const measureLine = (d) => {
    const line = d.querySelector('.station-body .q-line');
    const set = line ? [...line.querySelectorAll('.fig--letter')] : [];
    if (set.length < 2) return;
    const box = set.map((el) => el.getBoundingClientRect());
    const dot = line.ownerDocument.defaultView.getComputedStyle(line, '::before');
    lineRows.push({
      row: box.every((b) => Math.abs(b.top - box[0].top) < 6),
      ltr: box.every((b, i) => i === 0 || b.left > box[i - 1].left),
      start: box[0].left > line.getBoundingClientRect().left,
      dot: dot.content !== 'none' && parseFloat(dot.width) > 0,
    });
  };

  for (const part of GRADE_PARTS.slice(ERA_ONE)) {
    const seen = await driveStation(`#/grade/${part}`, measureTray, (d) => {
      watchLetters(d);
      pendingSeen += d.querySelectorAll('.station-body .fig-letters[data-pending]').length;
    });
    ok(seen.done && seen.rounds >= 7 && seen.stars === 3,
      `ودرجةُ الحرف ${part} تُقاد إلى ثلاث نجوم (${seen.rounds} جولة · ${seen.stars} نجوم)`);
    ok(seen.loose === 0 && seen.bare === 0 && seen.small === 0,
      `  **ولا حرفٍ لاتينيٍّ خارج \`.en\` المعزول**، ولا زرٍّ نصّيّ، وهدفُ اللمس ≥٦٤بك`
      + ` (${seen.loose}/${seen.bare}/${seen.small})`);
    await driveReturn(part);

    // ————— ١٨ح. 📖 **القصةُ شبهُ المفكوكة في موضعها من الرحلة** (بندُ الجلسة ٦) —————
    //
    // «كتابٌ لكل درجةٍ فصاعداً» — فقصةُ ح٦ تلي درجةَ ح٦ **على الخريطة**، ويقودها
    // الطفلُ بالقفل التسلسليّ نفسِه (لا نجمةَ مُلئت لها بيد). ومادّتُها نصٌّ يُقرأ
    // بالعين: **لا زرَّ أذنٍ في صفحاتها** إلا في نمذجة المعلّم.
    const story = curriculum.stations().find((s) => s.type === 'story' && s.part === part);
    if (!story) continue;
    const pages = new Set();
    const storySeen = await driveStation(`#/story/${part}`, null, (d) => {
      measureLine(d);
      const line = d.querySelector('.station-body .q-line');
      if (line) {
        pages.add([...line.querySelectorAll('.fig[data-word]')]
          .map((f) => f.dataset.word).join(' '));
      }
    });
    ok(storySeen.done && storySeen.rounds >= 3 && storySeen.stars === 3,
      `📖 **وقصةُ ${part} تُقاد صفحةً صفحة إلى ثلاث نجوم** (${storySeen.rounds} صفحةً `
      + `مقروءة · ${storySeen.stars} نجوم) — وهي أوّلُ نصٍّ متّصل يقع تحت عين الطفل`);
    ok(storySeen.loose === 0 && storySeen.bare === 0 && storySeen.small === 0,
      `  ولا حرفٍ لاتينيٍّ خارج \`.en\`، ولا زرٍّ نصّيّ، وهدفُ اللمس ≥٦٤بك`
      + ` (${storySeen.loose}/${storySeen.bare}/${storySeen.small})`);
    const storyWords = new Set([...pages].flatMap((line) => line.split(' ')).filter(Boolean));
    const openWords = new Set([
      ...curriculum.wordsUpTo(part).map((w) => w.w),
      ...curriculum.trickyAt(part),
    ]);
    ok(storyWords.size > 0 && [...storyWords].every((w) => openWords.has(w)),
      `  **وكلُّ كلمةٍ رُسمت في صفحاتها من المفتوح عند ${part}** (${storyWords.size} كلمةً`
      + `: ${[...storyWords].join(' ')}) — وهو ما يفحصه \`check_range\` في النصّ نفسِه`);
  }

  ok(lineRows.length > 0 && lineRows.every((r) => r.row && r.ltr && r.start && r.dot),
    `**وسطرُ القصة سطرٌ واحد يتقدّم من اليسار ومعه مؤشّرُ بدء السطر** `
    + `(${lineRows.length} قياساً · \`METHOD.md §٩·٣\`)`
    + (lineRows.some((r) => !r.row) ? ' — **يتراصّ عموداً**' : '')
    + (lineRows.some((r) => !r.ltr) ? ' — **يتقدّم من اليمين**' : '')
    + (lineRows.some((r) => !r.dot) ? ' — **بلا نقطةِ انطلاق**' : ''));

  // ————— ١٨خ. 🧩 **درجةُ العناقيد ح١٣ والصائتُ الأوسط** (بندُ الجلسة ٦) —————
  //
  // «CVCC/CCVC بلا رموزٍ جديدة» — فلا `sound-pick` فيها ولا `letter-pick`، وأشكالُها
  // دمجٌ وفكٌّ **وصائتٌ أوسط**: تُسمَع الكلمةُ ويُرى إطارُها بلا صائتها فيُختار من رسمين.
  //
  // **وسلّةُ الأشكال تجعل وقوعَه يقيناً لا حظّاً** (درسُ الفحص المتقلقل، الجلسة ٥):
  // تُستنفَد السلّةُ شكلاً شكلاً، فكلُّ ثلاث جولاتٍ تحمل الأشكالَ الثلاثة كلَّها —
  // والجولاتُ الخمسُ الأخيرة («وحدك») تحمل بالضرورة جولةَ صائتٍ أوسط مقيسة.

  const midSeen = { gaps: 0, framed: new Set(), hearts: new Set() };
  const clusterSeen = await driveStation('#/cluster/h13', measureTray, (d) => {
    watchLetters(d);
    // **وشائكاتُ الدرجة الأربعَ عشرةَ تُوسَم بقلوبها** (الميزانيةُ ٣١): علامةٌ لا نصّ
    for (const mark of d.querySelectorAll('.station-body .glyph-mark--heart')) {
      const word = mark.closest('.fig')?.dataset.word;
      if (word) midSeen.hearts.add(word);
    }
    const gap = d.querySelector('.station-body .glyph--gap');
    if (!gap) return;
    midSeen.gaps++;
    const frame = gap.closest('.fig-letters');
    if (frame) midSeen.framed.add([...frame.querySelectorAll('.glyph')].length);
  });
  ok(clusterSeen.done && clusterSeen.rounds >= 7 && clusterSeen.stars === 3,
    `🧩 **ودرجةُ العناقيد ح١٣ تُقاد إلى ثلاث نجوم** (${clusterSeen.rounds} جولة · `
    + `${clusterSeen.stars} نجوم) — بلا رمزٍ جديد، وكلماتُها CVCC/CCVC`);
  ok(clusterSeen.loose === 0 && clusterSeen.bare === 0 && clusterSeen.small === 0,
    `  ولا حرفٍ لاتينيٍّ خارج \`.en\`، ولا زرٍّ نصّيّ، وهدفُ اللمس ≥٦٤بك`
    + ` (${clusterSeen.loose}/${clusterSeen.bare}/${clusterSeen.small})`);
  ok(midSeen.gaps > 0 && [...midSeen.framed].every((n) => n >= 3),
    `  **والصائتُ الأوسط يُسأل عنه في إطارٍ يُرى** (${midSeen.gaps} جولةً، وإطارُها `
    + `${[...midSeen.framed].join('/') || '—'} مقاطع) — فيعرف الطفلُ أين يقع الناقص`);
  const era3Tricky = new Set(curriculum.GRADES.find((g) => g.id === 'h13').tricky);
  ok(midSeen.hearts.size > 0 && [...midSeen.hearts].every((w) => curriculum.HEART_WORDS[w]),
    `  **وشائكاتُ العهد الثالث تُوسَم بقلوبها** (${[...midSeen.hearts].join('، ')}`
    + `${[...midSeen.hearts].some((w) => era3Tricky.has(w)) ? ' — ومنها شائكةُ ح١٣ نفسِها'
      : ''}) — علامةٌ لا نصٌّ شارح`);

  // **وخطُّ المادّة وقع كذلك** (البند ٦ — Andika): كان الرسمُ يخرج موسوماً
  // `data-pending` إعلاناً لنيابة خطّ الواجهة، فصار المقيسُ **صفرَ نيابةٍ** وخطَّ
  // المادّة المقرَّرَ محسوباً على الرسم نفسِه في كل درجةٍ سِيقت.
  ok(pendingSeen === 0,
    `**وصفرُ نيابةٍ في رسوم المادّة** (\`data-pending\` — سقط يوم الهوية): ${pendingSeen}`);
  ok(materialFonts.size > 0 && [...materialFonts].every((f) => f === 'Andika'),
    `**ورسمُ الحرف بخطّ المادّة Andika** كما حكم المالك (${[...materialFonts].join('، ') || 'لا قياس'})`);
  ok(letterRows.length > 0 && letterRows.every((r) => r.row && r.ltr && !r.small),
    `**وصفُّ الدمج سطرٌ واحد يتقدّم من اليسار** (${letterRows.length} قياساً`
    + `، وكلُّ لبنةٍ فيه ≥٦٤بك)`
    + (letterRows.some((r) => !r.row) ? ' — **يتراصّ عموداً**' + worstRow(letterRows) : '')
    + (letterRows.some((r) => !r.ltr) ? ' — **يتقدّم من اليمين**' : '')
    + (letterRows.some((r) => r.small) ? ' — **لبنةٌ انكمشت بانتقالها**' : ''));

  // ————— ١٨ذ. **العهدُ الرابع: البدائلُ رسماً ونطقاً** (بندُ الجلسة ٧) —————
  //
  // «رسمٌ واحد للصوت أولاً ثم بدائلُه» (قاعدة Jolly · `METHOD.md §١٢-٦`) — وهي في
  // يد الطفل شكلان:
  //   • **الرسمُ البديل يُعلَّم على مرجعه** (ح١٤–ح١٥): يُعرَض المعلومُ (‏`ai` من ح٩)
  //     ويُسمَع صوتُه، فيُلمَس **الرسمُ الآخر** الذي يقوله — لا «اسمع الصوتَ والمس
  //     رسمَه» وجوابُه رسمان.
  //   • **والنطقُ البديل يُسأل عنه في كلمته** (ح١٦): رسمُه رسمُ أخيه، فيُؤطَّر موضعُه
  //     من كلمةٍ ناضجةٍ يفكّها الطفل ومعه في الأزرار نطقُه المعلوم.

  /* **وقصةُ العناقيد تُقاد قبلها** (وإلّا وقف القفلُ التسلسليّ دونها): درجةُ ح١٣
     سِيقت أعلاه، **وقصّتُها عقدةٌ بعدها** — فلو قُفز عنها لَبقيت ح١٤ مقفلةً وقرأ
     الفاحصُ «صفرُ جولة» في درجةٍ سليمة. (وهو ما وقع في أوّل تشغيلٍ لهذا المساق،
     وأمسكه التقريرُ المسمّي: ثلاثُ درجاتٍ وثلاثُ قصصٍ بصفر.) */
  const ERA_FOUR = [curriculum.CLUSTER_GRADE, 'h14', 'h15', 'h16'];
  const altSeen = { rounds: 0, anchors: new Set(), targets: new Set(), inWord: 0, focus: 0 };
  for (const part of ERA_FOUR) {
    // (ودرجةُ العناقيد سِيقت أعلاه بشاشتها هي — يُقاد ههنا نصُّ قصّتها وحدَه)
    const seen = part === curriculum.CLUSTER_GRADE
      ? { done: true, rounds: 7, stars: 3, loose: 0, bare: 0, small: 0 }
      : await driveStation(`#/grade/${part}`, measureTray, (d) => {
      watchLetters(d);
      pendingSeen += d.querySelectorAll('.station-body .fig-letters[data-pending]').length;
      const choices = d.querySelector('.q-choices--alt');
      if (choices) {
        altSeen.rounds++;
        const anchor = d.querySelector('.q-stage .fig--letter[data-word]');
        const want = d.querySelector('.q-stage[data-ask]')?.dataset.ask;
        if (anchor) altSeen.anchors.add(anchor.dataset.word);
        if (want) altSeen.targets.add(want);
      }
      // **ونطقُ ح١٦ يُسأل عنه في كلمةٍ بموضعٍ مؤطَّر** (لا رسماً معزولاً)
      const focus = d.querySelector('.q-stage .glyph--focus');
      if (focus) {
        altSeen.focus++;
        const word = focus.closest('.fig--letter')?.dataset.word || '';
        if (word.length > 2) altSeen.inWord++;
      }
    });
    ok(seen.done && seen.rounds >= 7 && seen.stars === 3,
      `**ودرجةُ البدائل ${part} تُقاد إلى ثلاث نجوم** (${seen.rounds} جولة · `
      + `${seen.stars} نجوم)`);
    ok(seen.loose === 0 && seen.bare === 0 && seen.small === 0,
      `  ولا حرفٍ لاتينيٍّ خارج \`.en\`، ولا زرٍّ نصّيّ، وهدفُ اللمس ≥٦٤بك`
      + ` (${seen.loose}/${seen.bare}/${seen.small})`);
    await driveReturn(part);

    const story = curriculum.stations().find((t) => t.type === 'story' && t.part === part);
    if (!story) continue;
    const pages = new Set();
    const storySeen = await driveStation(`#/story/${part}`, null, (d) => {
      measureLine(d);
      const line = d.querySelector('.station-body .q-line');
      if (line) {
        pages.add([...line.querySelectorAll('.fig[data-word]')]
          .map((f) => f.dataset.word).join(' '));
      }
    });
    ok(storySeen.done && storySeen.rounds >= 3 && storySeen.stars === 3,
      `📖 وقصةُ ${part} تُقاد صفحةً صفحة إلى ثلاث نجوم (${storySeen.rounds} صفحةً · `
      + `${storySeen.stars} نجوم)`);
    const storyWords = new Set([...pages].flatMap((line) => line.split(' ')).filter(Boolean));
    const openWords = new Set([
      ...curriculum.wordsUpTo(part).map((w) => w.w),
      ...curriculum.trickyAt(part),
    ]);
    ok(storyWords.size > 0 && [...storyWords].every((w) => openWords.has(w)),
      `  وكلُّ كلمةٍ رُسمت في صفحاتها من المفتوح عند ${part} (${storyWords.size} كلمة)`);
  }

  const anchorSound = (id) => curriculum.phonemeOf(id);
  ok(altSeen.rounds > 0 && [...altSeen.targets].every((id) => curriculum.priorGrapheme(id)),
    `🔤 **والرسمُ البديل يُعلَّم على مرجعه** (${altSeen.rounds} جولةً: `
    + `${[...altSeen.targets].join('، ')}) — ولكلٍّ رسمٌ أسبقُ منه لصوته`);
  ok(altSeen.anchors.size > 0 && [...altSeen.anchors].every((known) =>
    [...altSeen.targets].some((id) => anchorSound(id) === anchorSound(known))),
    `  **والمرجعُ المعروضُ يقول صوتَ الجواب نفسَه** (${[...altSeen.anchors].join('، ')}) `
    + '— فالسؤالُ «أيُّ رسمٍ آخرَ يقوله» لا «ما رسمُ هذا الصوت»');
  ok(altSeen.focus > 0 && altSeen.inWord > 0,
    `  **ونطقُ ح١٦ البديل يُسأل عنه في كلمةٍ بموضعٍ مؤطَّر** (${altSeen.focus} جولةً، `
    + `منها ${altSeen.inWord} في كلمةٍ تُفكّ) — لا رسماً معزولاً جوابُه صوتان`);

  // ————— ١٨د. قياسُ مسار الحرف بمفاتيح المنهج، وأنواعُه الخمسة كلُّها —————

  const letterState = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  // **ومسارُ الحرف اليومَ ثلاثةُ أنواع**: الدرجاتُ والعناقيدُ والقصص — فمفاتيحُه
  // تُقابَل بمفاتيح **المسار** لا بمفاتيح نوعٍ واحد منه.
  const letterWanted = new Set(curriculum.stations()
    .filter((s) => s.track === 'letter').flatMap((s) => s.skills));
  const letterKeys = Object.keys(letterState.skills || {})
    .filter((k) => /\|(sound-pick|alt-pick|letter-pick|build|decode|read|mid-pick)$/.test(k));
  ok(letterKeys.length > 0 && letterKeys.every((k) => letterWanted.has(k)),
    `وقياسُ مسار الحرف مكتوبٌ بمفاتيح المنهج (${letterKeys.length} مفتاحاً)`);
  ok(['sound-pick', 'alt-pick', 'letter-pick', 'build', 'decode', 'read', 'mid-pick']
    .every((kind) => letterKeys.some((k) => k.endsWith(`|${kind}`))),
    'وأشكالُه السبعة كلُّها مقيسة (رسمُ الصوت · **الرسمُ البديل** · صوتُ الرسم · الدمجُ '
    + '· الفكُّ · الشائكة · الصائتُ الأوسط)');
  ok(['gpc|', 'word|', 'tricky|', 'vowel|', 'text|']
    .every((unit) => letterKeys.some((k) => k.startsWith(unit))),
    'ووحداتُه الخمس (`gpc` · `word` · `tricky` · **`vowel`** · **`text`**) كلُّها في ليتنر');

  // ————— ١٨هـ. 🔒 **قيدُ الاقتران مشهودٌ عاملاً في الشجرة الحية** —————
  //
  // **معيارُ قبول الجلسة نصّاً**: «كلمةُ قراءةٍ غيرُ متقنةٍ سمعاً … لا يولّدها التطبيق
  // — مُجرَّباً سالباً في الشجرة الحية لا في الفاحص وحده». فالمدسوسةُ أعلاه بقيت في
  // الصندوق ٢، وقد سِيقت خمسُ درجاتٍ بكل أشكالها — فإن لم تُرسَم ولم يُسأل عنها مرّةً
  // واحدة فذلك القيدُ يعمل في يد الطفل لا في نيّة الشيفرة.
  //
  // **والغيابُ وحدَه لا يكفي شهادةً**: قد يغيب لأنّ الشاشةَ لا تولّد قراءةً أصلاً.
  // فيُقاس معه أنّ أخواتِها الناضجات **قد رُسمن فعلاً**، ثم تُرفَع المدسوسةُ إلى
  // الصندوق ٣ وتُعاد الدرجةُ نفسُها — **فتظهر**. بابٌ لا جدار.

  const ripened = gradeWords.filter((w) => w.w !== held.w && shownWords.has(w.w));
  ok(ripened.length > 0,
    `وكلماتُ القراءة الناضجةُ رُسمت فعلاً في الدرجات (${ripened.length} كلمة: `
    + `${ripened.slice(0, 4).map((w) => w.w).join('، ')}) — فالغيابُ يُقاس على شاشةٍ ترسم`);
  ok(!shownWords.has(held.w),
    `**والمدسوسةُ «${held.w}» لم تُرسَم ولم يُسأل عنها في أيّ تمرين قراءة** — `
    + `مفتاحُها «${held.listen}» في الصندوق ٢ دون عتبة الإتقان (قيدُ الاقتران حيّاً)`);

  const heldKeys = Object.keys(letterState.skills || {})
    .filter((k) => k.startsWith(`word|${held.w}|`) && /\|(build|decode)$/.test(k));
  ok(heldKeys.length === 0,
    `ولا مفتاحَ قراءةٍ كُتب لها في ليتنر (${heldKeys.join('، ') || 'لا شيء'})`);

  /* **وحضورُها يُصنَع بالبنية لا يُنتظَر بالحظّ** — إصلاحُ فحصٍ متقلقل (بندُ المراقبة
     في قبول الجلسة ٤، أُمسك في الجلسة ٥ بعد أن صار كلُّ إخفاقٍ يُطبَع سطرَه):
     كانت الدرجةُ تُقاد مرّةً ويُطالَب أن تقع المدسوسةُ في جولاتها، وجولةُ الدمج
     تنتقي **واحدةً من كلمات الدرجة الناضجات** ببذرةِ لحظتها — فأربعُ كلماتٍ في ح٥
     تجعل غيابَها بالقرعة لا بالقيد: قِيس ذلك فكان **٢١٪ من ٣٠٠ بذرة**، وهو عينُ
     «جولتان من أربعٍ» اللتان رآهما المدير.
     فتُصنَع الحالُ بحيث **لا كلمةَ ناضجةً في درجتها سواها**: كلماتُ الدرجات السابقة
     تبقى ناضجةً (فلمشتّتات الفكّ صورُها)، وأخواتُها في درجتها هي تُردّ إلى الصندوق ٢.
     وسلّةُ الأشكال تُنفِق أشكالَها الخمسةَ في أوّل خمس جولات، فجولةُ الدمج واقعةٌ
     لا محالة ومادّتُها هي وحدَها — فصار الشاهدُ حتمياً (صفرُ غيابٍ في ٤٠٠ بذرة). */
  const freed = { ...(letterState.skills || {}) };
  for (const word of gradeWords) {
    if (word.grade === held.grade) freed[word.listen] = ripe(2);
  }
  freed[held.listen] = ripe(4);
  win.localStorage.setItem('listen.progress.v1',
    JSON.stringify({ ...letterState, skills: freed }));
  await reopen();
  const freedWords = new Set();
  await driveStation(`#/grade/${held.grade}`, null, (d) => {
    for (const fig of d.querySelectorAll('.station-body .fig[data-word]')) {
      if (fig.dataset.word) freedWords.add(fig.dataset.word);
    }
    const ask = d.querySelector('.q-stage[data-ask]')?.dataset.ask;
    if (ask) freedWords.add(ask);
  });
  ok(freedWords.has(held.w),
    `**وما إن تبلغ الصندوقَ ٣ تدخل الشاشةَ نفسَها** («${held.w}» ظهرت بعد نضجها) — `
    + 'فالقيدُ بابٌ لا جدار');

  // ————— ١٨و. 🔒 **والشائكاتُ درجتان** (حكمُ المدير · `METHOD.md §٦`) —————
  //
  // «الشائكةُ **ذاتُ المدخل في الرصيد السمعي** يسري عليها القيدُ كسائر الكلمات» —
  // فشائكاتُ العهد الثاني الثمانِ ضمائرُ (`he` · `she`…) لها مفاتيحُ سمعية، ولا
  // تُقرأ حتى تنضج. **ويُقاس الطرفان في شاشةٍ حيّة**: تُنضَج `she` وحدَها فتخرج
  // في تمرين شائكة ولا تخرج أختُها `he` معها — وهما شائكتا الدرجة نفسِها (ح٦).
  //
  // **والحالُ مصنوعةٌ بحيث لا يكون للحظّ فيها نصيب** (درسُ الفحص المتقلقل، الجلسة ٥):
  // سلّةُ الأشكال تُنفِق أشكالَها في أوّل جولاتٍ خمس، فجولةُ الشائكة واقعةٌ لا محالة،
  // ومادّتُها الناضجةُ واحدةٌ لا غير.

  /* **ويُشهَد على درجتين لا درجة** (زيادةُ الجلسة ٨): الشاهدُ الأول درجةُ ح٦
     (`he`/`she` — ضمائرُ الجلسة ٥)، **والثاني درجةُ الضمائر التي أيقظها مشهدُ
     المتكلم والمخاطَب** (`we`/`me` — بندُ هذه الجلسة). فما استيقظ اليومَ يُشهَد
     **سالباً** كما شُهد عليه أمس: لا يكفي أن يُقاس مفتاحُه السمعيّ، بل يجب أن يبقى
     القيدُ حاكماً عليه في شاشةٍ حيّة. **والدرجتان تُقرآن من المنهج لا تُكتبان هنا**. */
  const listenedTricky = (g) => g.tricky.filter((w) => curriculum.HEART_WORDS[w]?.listen);
  const deixisMeasured = new Set(curriculum.stations()
    .flatMap((t) => ((t.owners || []).some((o) => o.pose) ? t.sentences || [] : []))
    .map((s) => s.measures).filter(Boolean));
  const trickyCases = [...new Set([
    curriculum.GRADES.find((g) => listenedTricky(g).length >= 2),
    curriculum.GRADES.find((g) => listenedTricky(g).length >= 2
      && g.tricky.some((w) => deixisMeasured.has(w))),
  ].filter(Boolean))];

  const drawnTricky = async (gradeId) => {
    const seen = new Set();
    await driveStation(`#/grade/${gradeId}`, null, (d) => {
      for (const fig of d.querySelectorAll('.station-body .fig[data-word]')) {

        if (fig.dataset.word) seen.add(fig.dataset.word);
      }
      const ask = d.querySelector('.q-stage[data-ask]')?.dataset.ask;
      if (ask) seen.add(ask);
    });
    return seen;
  };

  for (const trickyGrade of trickyCases) {
    const [heldTricky, freeTricky] = listenedTricky(trickyGrade);
    const woke = deixisMeasured.has(heldTricky) || deixisMeasured.has(freeTricky);
    const tag = woke ? '🙋 (وقد أيقظها مشهدُ المتكلم والمخاطَب) ' : '';
    const heldState = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
    const trickySkills = { ...(heldState.skills || {}) };
    trickySkills[curriculum.HEART_WORDS[freeTricky].listen] = ripe(4);
    delete trickySkills[curriculum.HEART_WORDS[heldTricky].listen];
    /* **وتُمحى سابقتُها من السجلّ كذلك** (زيادةُ الجلسة ٧): صارت مفاتيحُ الشائكات
       ذواتِ المدخل تنضج في صدر المساق (لأنّ قصص ح١٠+ تحتاجها)، فسُئل عن `he` في ح٦
       **بحقّ** وكُتب مفتاحُ قراءتها. والحالُ المصنوعةُ ههنا حالُ طفلٍ **لم يتقنها
       سمعاً قطّ** — ومثلُه لا سجلَّ قراءةٍ له فيها، فيُمحى ليصدُق الشاهدُ على ما يصنع. */
    delete trickySkills[`tricky|${heldTricky}|read`];
    win.localStorage.setItem('listen.progress.v1',
      JSON.stringify({ ...heldState, skills: trickySkills }));
    await reopen();
    /* **وتُقاد الدرجةُ حتى تقع جولةُ الشائكة، بحدٍّ معلَن** (تصحيحُ الجلسة ٨):
       سلّةُ الأشكال تُنفِق أشكالَها في الجولات السبع، **لكنّ الشائكةَ الناضجة قد تكون
       ثنتين** حين تحمل الدرجةُ شائكةَ وظيفةٍ صرفة لا مفتاحَ سمعيّ لها (ح٧ فيها `be`
       مع `me`) — فتقع القرعةُ على أختها ويُقرأ ذلك حمرةً في شاهدٍ سليم (وقع في
       تشغيلٍ وخضِر في آخر: قرينةُ قرعةٍ لا عيبِ محتوى). فتُعاد القيادةُ ثلاثاً على
       الأكثر، **والشاهدُ السالب يُجمَع من الجولات كلِّها** فيشتدّ بالإعادة لا يخفّ. */
    const trickyDrawn = new Set();
    for (let go = 0; go < 3 && !trickyDrawn.has(freeTricky); go++) {
      for (const word of await drawnTricky(trickyGrade.id)) trickyDrawn.add(word);
    }
    ok(trickyDrawn.has(freeTricky),
      `${tag}**والشائكةُ الناضجةُ سمعاً تُسأل** («${freeTricky}» بمفتاح `
      + `«${curriculum.HEART_WORDS[freeTricky].listen}» في الصندوق ٤ — ${trickyGrade.id})`);
    ok(!trickyDrawn.has(heldTricky),
      `  **وأختُها التي لم تنضج لم تُرسَم ولم يُسأل عنها** («${heldTricky}» بلا سجلٍّ `
      + 'سمعيّ) — فقيدُ الاقتران يحكم الشائكةَ كما يحكم الكلمة');
    const heldTrickyKeys = Object.keys(JSON.parse(
      win.localStorage.getItem('listen.progress.v1') || '{}').skills || {})
      .filter((k) => k === `tricky|${heldTricky}|read`);
    ok(heldTrickyKeys.length === 0,
      `  ولا مفتاحَ قراءةٍ كُتب لها في ليتنر (${heldTrickyKeys.join('، ') || 'لا شيء'})`);
  }

  // **والمراجعةُ اليومية تسحب من الجبهتين بميزانها المعلَن** (`REVIEW_MIX`):
  // تُفتَح جلسةٌ ويُقرأ **ما كتبته في ليتنر** — فإن جاءت من جبهةٍ واحدة فالتوازي
  // كلامٌ في وثيقة. (والنسبةُ بيانٌ يُقرأ من المنهج، فلا يُكتب هنا رقمٌ ثانٍ.)
  //
  // **والجبهةُ تُقرأ من المفتاح لا من شكل الشاشة** — عيبٌ أُمسك في أوّل تشغيل: كان
  // الفحصُ يستدلّ على جبهة التمرين بما رُسم (`.q-tray--letters` وأخواتها)، فتُحسَب
  // جولةُ **فكٍّ** أو **رسمٍ لصوت** سمعاً لأنّ صفَّ اللبنات لا يظهر فيهما — فشهد
  // بجبهةٍ واحدة والجلسةُ مخلوطة. والمفتاحُ لا يكذب: ما كُتب في ليتنر هو ما سُئل.
  const isLetterKey = (k) => /\|(sound-pick|alt-pick|letter-pick|build|decode|read)$/.test(k);
  const isListenKey = (k) => /\|(listen-pick|tpr-do|tpr-put|tpr-two|pick|blend-ear|segment-ear)$/
    .test(k);
  const stamp = () => Object.fromEntries(Object.entries(JSON.parse(
    win.localStorage.getItem('listen.progress.v1') || '{}').skills || {})
    .map(([key, skill]) => [key, `${skill.right}/${skill.wrong}/${skill.seen}`]));

  /* **وتُصفَّى الجلسةُ من المستحقّ أوّلاً** — وإلا شهدنا على غير ما نقيس: صدرُ
     المراجعة **الأضعفُ أولاً من حوضٍ مخلوط** (وهو باقٍ كما هو، ولا حصّةَ فيه لجبهة)،
     وحالُ ليتنر المصنوعةُ في هذا الفحص كُتبت بـ`due: 0` فصارت **كلُّ مفاتيح السمع
     مستحقّةً في يومها** — فابتلع المستحقُّ الجلسةَ كلَّها وشهد الفحصُ بجبهةٍ واحدة
     على ميزانٍ لم يُسأل أصلاً (أمسكه التشغيلُ الثاني: «6 تمريناً كتبت 7 مفاتيح من
     listen»). فتُدفَع آجالُ المستحقّ إلى الغد، ويُسأل **حوضُ التنويع** وحدَه — وهو
     موضعُ الميزان المعلَن. */
  /* **ويُصفَّى منها البِكرُ كذلك** (زيادةُ الجلسة ٧): صار المفتاحُ الذي فُتحت محطتُه
     ولم يُقَس بعدُ يتصدّر جلسةَ اليوم (`progress.todaySkills` — بابُ الدخول إلى
     ليتنر)، وهو **صوابٌ في يد الطفل** وابتلاعٌ لحوض التنويع في هذا الشاهد. فتُصنَع
     حالُ طفلٍ **قِيس له كلُّ مفتاح**: لا مستحقَّ اليومَ ولا بِكرَ — فما يبقى هو
     التنويعُ وحدَه، وهو موضعُ الميزان المعلَن. */
  const rested = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  rested.skills = rested.skills || {};
  for (const key of new Set(curriculum.stations().flatMap((t) => t.skills || []))) {
    rested.skills[key] = rested.skills[key]
      || { right: 1, wrong: 0, box: 1, due: 0, seen: 0, since: 0 };
  }
  for (const skill of Object.values(rested.skills)) {
    skill.box = Math.max(1, skill.box || 0);
    skill.due = 99999;
  }
  win.localStorage.setItem('listen.progress.v1', JSON.stringify(rested));
  await reopen();

  const beforeMix = stamp();
  win.location.hash = '#/review';
  await waitFor(() => appDoc()?.querySelector('.dots'), 25000);
  let mixedRounds = 0;
  for (let i = 0; i < 10; i++) {
    const found = await waitFor(() => {
      const d = appDoc();
      return d && (readyIn(d) || d.querySelector('.celebrate'));
    }, 25000);
    const d = appDoc();
    if (!found || d.querySelector('.celebrate')) break;
    const stageNow = d.querySelector('.q-stage');
    mixedRounds++;
    if (!await answerNow(d)) break;
    await waitFor(() => {
      const x = appDoc();
      return x && (x.querySelector('.q-stage') !== stageNow || x.querySelector('.celebrate'));
    }, 25000);
  }
  await waitFor(() => appDoc()?.querySelector('.celebrate'), 25000);
  const touched = Object.entries(stamp())
    .filter(([key, value]) => beforeMix[key] !== value).map(([key]) => key);
  const fronts = new Set(touched.map((k) => (isLetterKey(k) ? 'letter'
    : isListenKey(k) ? 'listen' : 'other')));
  ok(mixedRounds >= 5 && fronts.has('letter') && fronts.has('listen'),
    `**ومراجعةُ اليوم تسحب من الجبهتين معاً** (${mixedRounds} تمريناً كتبت `
    + `${touched.length} مفتاحاً من ${[...fronts].join(' و')}) — `
    + 'بميزان `REVIEW_MIX` المعلَن في المنهج');

  // ————— ١٨ز. **جبهتان مستقلتان: كلٌّ تتقدم وتتراجع بقياسها** (معيارُ الجلسة ٥) —————
  //
  // الجبهتان في ليتنر لا في الكلام: يُقاد **مسارُ الحرف** إلى الخطأ عمداً في درجةٍ
  // كاملة، ثم يُقرأ السجلّ: مفاتيحُ الحرف **تراجعت إلى الصندوق صفر**، ومفاتيحُ السمع
  // **لم تُخدَش** — فما تعلّمه الطفلُ سمعاً لا يهبط لأنّه تعثّر في رسمٍ، وعكسُه.

  const boxesOf = (state, pick) => Object.entries(state.skills || {})
    .filter(([key]) => pick(key)).map(([, s]) => s.box);

  const beforeFall = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  const listenBefore = boxesOf(beforeFall, isListenKey);
  // **ودرجةُ السقوط أوّلُ درجةِ الشاهد** (`trickyCases[0]` — كانت `trickyGrade` قبل أن
  // يصير الشاهدُ درجتين في الجلسة ٨): تُقاد إلى الخطأ عمداً، فتهبط مفاتيحُ الحرف
  // وحدَها ولا تُخدَش مفاتيحُ السمع.
  const fallGrade = trickyCases[0];
  win.location.hash = `#/grade/${fallGrade.id}`;
  await waitFor(() => appDoc()?.querySelector('.station-body .next'), 30000);
  appDoc().querySelector('.station-body .next')?.click();
  let fallen = 0;
  for (let i = 0; i < 12; i++) {
    const found = await waitFor(() => {
      const d = appDoc();
      return d && (readyIn(d) || d.querySelector('.celebrate'));
    }, 25000);
    const d = appDoc();
    if (!found || d.querySelector('.celebrate')) break;
    const stageNow = d.querySelector('.q-stage');
    if (!await answerNow(d, true)) break;          // **خطأٌ مقصود في كل جولة**
    fallen++;
    await waitFor(() => {
      const x = appDoc();
      return x && (x.querySelector('.q-stage') !== stageNow || x.querySelector('.celebrate'));
    }, 25000);
  }
  await waitFor(() => appDoc()?.querySelector('.celebrate'), 25000);
  const afterFall = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  const letterFallen = boxesOf(afterFall, isLetterKey).filter((box) => box === 0).length;
  ok(fallen > 0 && letterFallen > 0,
    `**وجبهةُ الحرف تتراجع بقياسها**: ${fallen} خطأً مقصوداً أنزلت ${letterFallen} مفتاحاً `
    + 'إلى الصندوق صفر');
  ok(boxesOf(afterFall, isListenKey).join(',') === listenBefore.join(','),
    `**وجبهةُ السمع لم تُخدَش** (${listenBefore.length} مفتاحاً بصناديقها كما كانت) — `
    + 'فما أُتقن سمعاً لا يهبط بتعثّرٍ في رسم');


  // ————— ١٨س. 🔒 **الفكُّ في مشهد**: كلمةٌ تُقرأ فيُلمَس مصداقُها (بندُ الجلسة ٦) —————
  //
  // «كلمةُ موضعٍ أو صفةٍ تُقرأ فيُلمَس مصداقُها في مشهدٍ مرسوم» (حكمُ قبول الجلسة ٤):
  // كانت `in` و`on` و`big` خارج الفكّ بالبيان لأنّ لا صورةَ مفردةَ لها، فصار لها
  // اليومَ بابُها — **ومفتاحُ فكٍّ في ليتنر** لم يكن لها.
  //
  // **والحالُ مصنوعةٌ بحيث لا يكون للحظّ فيها نصيب** (درسُ الفحص المتقلقل): يُنضَج
  // في الدرجة **كلمةُ المشهد وحدَها**، فكلُّ جولة فكٍّ فيها مشهدٌ لا محالة — ويُقاد
  // المشهدان كلاهما: الموضعُ (`in` في صندوق) والحجمُ (`big` بين كرتين).

  /* **والمحطتان مختارتان بحسابٍ لا بذوق**: سلّةُ الأشكال تُستنفَد شكلاً شكلاً، فمحطةٌ
     أشكالُها أربعةٌ (ح٢: رمزان ودمجٌ وفكّ) وأخرى ثلاثةٌ عاملة (ح١٣: دمجٌ وفكٌّ وصائتٌ
     أوسط) **تقعُ فيهما جولةُ الفكّ في «وحدك» يقيناً** — لا بحظّ بذرة. */
  const sceneCases = [
    { part: 'h02', hash: '#/grade/h02', word: 'in', kind: 'zone',
      ar: 'الموضعُ في مشهد الصندوق' },
    { part: 'h13', hash: '#/cluster/h13', word: 'small', kind: 'size',
      ar: 'الحجمُ بين كرتين' },
  ];
  const sceneState = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}');
  const sceneSkills = { ...(sceneState.skills || {}) };
  for (const row of sceneCases) {
    const grade = curriculum.GRADES.find((g) => g.id === row.part);
    for (const word of grade.words) {
      if (word.w === row.word) sceneSkills[word.listen] = ripe(4);
      else delete sceneSkills[word.listen];
    }
  }
  win.localStorage.setItem('listen.progress.v1',
    JSON.stringify({ ...sceneState, skills: sceneSkills }));
  await reopen();

  for (const row of sceneCases) {
    const seen = { rounds: 0, zones: new Set(), sizes: new Set(), words: new Set() };
    const driven = await driveStation(row.hash, null, (d) => {
      const stage = d.querySelector('.station-body .q-stage[data-ask]');
      const box = d.querySelector('.station-body .q-box');
      const balls = [...d.querySelectorAll('.station-body .q-choices--scene .fig--ball')];
      if (!stage || (!box && !balls.length)) return;
      seen.rounds++;
      seen.words.add(stage.dataset.ask);
      for (const zone of d.querySelectorAll('.station-body .q-zone')) {
        seen.zones.add(zone.dataset.word);
      }
      for (const ball of balls) seen.sizes.add(ball.dataset.name);
    });
    const shown = row.kind === 'zone' ? seen.zones : seen.sizes;
    ok(driven.done && driven.stars === 3 && seen.rounds > 0,
      `🔒 **و«${row.word}» تُفكّ ويُلمَس مصداقُها** (${row.ar} — ${seen.rounds} جولةً في `
      + `${row.part}، والمحطةُ إلى ${driven.stars} نجوم)`);
    ok(seen.words.size === 1 && seen.words.has(row.word),
      `  والمسؤولُ عنه كلمةُ المشهد وحدَها (${[...seen.words].join('، ') || 'لا شيء'})`);
    ok(shown.size >= 2 && [...shown].every(Boolean),
      `  ومصاديقُها معروضةٌ كلُّها في كل جولة (${[...shown].join(' · ')}) — `
      + 'فالفرقُ مكانيٌّ أو حجميّ لا استبعاد');
    const decodeKey = Object.keys(JSON.parse(
      win.localStorage.getItem('listen.progress.v1') || '{}').skills || {})
      .filter((k) => k === `word|${row.word}|decode`);
    ok(decodeKey.length === 1,
      `  **ومفتاحُ فكِّها مكتوبٌ في ليتنر** (\`word|${row.word}|decode\`) — وهو المفتاحُ `
      + 'الذي لم يكن لها قبل اليوم');
  }

  // ————— ١٨ش. **توسعةُ الرصيد س٥ وجملُ «الآن وهنا»** (بندُ الجلسة ٧) —————
  //
  // خمسُ محطاتٍ بكلماتها (ملابسُ ومدرسةٌ وبيتٌ وأماكنُ وأفعال) تخدمها شاشةُ س١ بطبعها،
  // **وسادستُها جملٌ تُطابَق مشاهدَ**: تُسمَع الجملةُ ويُلمَس المشهدُ الذي تقوله. وفيها
  // بيتُ الضمائر الذي انتظرته الجلستان ٥ و٦: مقيسُ جملةٍ لا يفرّق خياراتِها إلا الضميرُ
  // **هو الضميرُ نفسُه** (`word|he|listen-pick`) — وبه يستيقظ `readableTrickyAt`.

  const listen5 = curriculum.stations().filter((t) => t.stage === 'listen5');
  const beforeFive = stamp();
  // **وما رُسم من المراجع الضميرية يُجمَع وهي تُقاد** (بندُ الجلسة ٨): المتكلمُ
  // والمخاطَبُ **يُرسَمان** ولا يُصوَّران، فالشاهدُ أن تقع بطاقاتُهما تحت بصر الطفل
  // في مساقٍ حقيقيّ — لا أن يُعلنا في بيانات.
  const drawnDeixis = new Set();
  for (const part of listen5) {
    const seen = await driveStation(`#/quiz/${part.part}`, null, (d) => {
      for (const fig of d.querySelectorAll('.station-body .fig--deixis[data-word]')) {
        drawnDeixis.add(fig.dataset.word);
      }
    });
    ok(seen.done && seen.rounds >= 5 && seen.stars === 3,
      `🧺 ومحطةُ ${part.part} («${part.title}») تُقاد إلى ثلاث نجوم `
      + `(${seen.rounds} جولة · ${seen.stars} نجوم)`);
    ok(seen.loose === 0 && seen.bare === 0 && seen.small === 0,
      `  ولا حرفٍ لاتينيّ في شاشتها، ولا زرٍّ نصّيّ، وهدفُ اللمس ≥٦٤بك`
      + ` (${seen.loose}/${seen.bare}/${seen.small})`);
  }
  const fiveKeys = Object.keys(stamp()).filter((k) => beforeFive[k] !== stamp()[k]);
  const sentenceStation = listen5.find((t) => t.sentences.length);
  const matched = fiveKeys.filter((k) => k.endsWith('|match'));
  const pronouns = (sentenceStation?.sentences || []).filter((one) => one.measures)
    .map((one) => `word|${one.measures}|listen-pick`);
  ok(matched.length > 0,
    `**وجملُ س٥-٦ تُقاس \`sentence|…|match\`** (${matched.length} مفتاحاً: `
    + `${matched.slice(0, 3).join('، ')}) — وحدةُ جملٍ لا وحدةُ قصص`);
  ok(pronouns.length > 0 && pronouns.some((k) => fiveKeys.includes(k)),
    `🔓 **وضميرُ الجملة يُقاس بمفتاح الرصيد نفسِه** `
    + `(${pronouns.filter((k) => fiveKeys.includes(k)).join('، ')}) — `
    + 'وهو المفتاحُ الذي انتظرته شائكاتُ ح٦ نائمةً منذ الجلسة ٥');

  // ————— ١٨ط. 🙋 **مشهدُ المتكلم والمخاطَب** (بندُ الجلسة ٨ — البديل أ) —————
  //
  // «شكلُ مشهدٍ بمتكلّمٍ ومخاطَب (وضعان يُدرَّسان في النمذجة) يفتح الضمائرَ الأربع
  // النائمة (‏we · me · my · you)». **والشاهدُ في مساقٍ حيّ**: بطاقاتُهما تُرسَم فعلاً،
  // ومفاتيحُ الأربع تُكتب في ليتنر — ولا يُقبَل إعلانُ بيانات مكان ذلك.

  const deixisStation = listen5.find((t) => (t.owners || []).some((o) => o.pose));
  const deixisNames = new Set(curriculum.DEIXIS.map((one) => one.w));
  ok(!!deixisStation,
    `🙋 **ومحطةُ «${deixisStation?.title ?? '؟'}» في الرحلة** — أصحابُ مشهدها فيهم `
    + `المتكلمُ والمخاطَب مرسومَين (${curriculum.DEIXIS.map((o) => o.w).join('، ')})`);
  ok(drawnDeixis.size === deixisNames.size
    && [...deixisNames].every((one) => drawnDeixis.has(one)),
    `  وبطاقاتُهم رُسمت تحت بصر الطفل في المساق (${[...drawnDeixis].join('، ') || 'لا شيء'})`);
  /* **والمقيسُ ما وقع في مساقٍ حيّ، لا ما يُشترَط وقوعُه كلُّه في جلسةٍ واحدة**:
     جلسةُ المحطة خمسُ جولاتٍ مقيسة على أربع جملٍ **وقبلها جولتا عونٍ غيرُ مقيستين
     تأكلان من السلّة** — فقد تتخلّف جملةٌ عن جلسةٍ بعينها بالقرعة، ولا عيبَ في ذلك
     (وهو حالُ س٥-٦ نفسِها). **وتمامُ قياس الأربع في عمر الجهاز يحرسه حارسُ الوعد**
     (`test_promise` — كلُّ مفتاحٍ يُقاس)، **ومادّةُ كلِّ مفتاحٍ بمداه** يحرسها
     `test_measure`. فالمقيسُ ههنا ثلاثةٌ: الأربعةُ مُعلَنةٌ في المحطة، وقد استيقظ
     منها في هذا المساق ما استيقظ فعلاً، **وما كُتب فمن الأربع لا من غيرها**. */
  const woken = (deixisStation?.skills || []);
  const wokenNow = woken.filter((k) => fiveKeys.includes(k));
  const strayHere = fiveKeys.filter((k) => /\|(me|we|my|you)\|/.test(k) && !woken.includes(k));
  ok(woken.length === 4 && wokenNow.length > 0 && strayHere.length === 0,
    `🔓 **والضمائرُ الأربع النائمة استيقظت بمفاتيحها** (المحطةُ تعلن ${woken.length}`
    + `، وكُتب في هذا المساق ${wokenNow.length}: ${wokenNow.join('، ')}) — `
    + 'وكانت معلنةً بلا محطةٍ تقيسها منذ الجلسة ٥'
    + (strayHere.length ? ` — ومن خارجها: ${strayHere.join('، ')}` : ''));

  // ————— ١٨ص. 🚪 **بوابةُ الختام: من أضعف الرحلة كلِّها** (بندُ الجلسة ٧) —————
  //
  // «من أضعف الرحلة كلِّها (السمعُ والحرفُ معاً)، ≥٨٠٪، لا رسوب» — وتُقاد مرّتين
  // كأختيها: **خطأً فلا تُفتَح** (بلا لفظ رسوب ولا حدٍّ للإعادة)، ثم صواباً فتُفتَح
  // ويُذكَر فيها بابُ «المستوى الثاني» **ذكراً لا وعداً يُقاس**.

  const endGate = curriculum.gateById('end');
  win.location.hash = '#/gate/end';
  const endScreen = await waitFor(() => appDoc()?.querySelector('.gate-head'), 25000);
  ok(!!endScreen, '🚪 **بوابةُ ختام التأسيس تُفتَح** (آخرُ عقدة في الرحلة)');
  const endAsks = await driveGate(3);
  let endDoc = appDoc();
  ok(endAsks.length === 10, `وتُقاد عشرةَ تمارين (${endAsks.length})`);
  ok(!!endDoc.querySelector('.celebrate--again'),
    '**ودون العتبة لا تُفتَح** — «ليس بعدُ» بلا لفظ رسوب');
  ok(endDoc.body.textContent.includes(endGate.again),
    `ونصُّ تشجيعها من بيانها هو («${endGate.again}»)`);
  [...endDoc.querySelectorAll('.celebrate button')]
    .find((b) => /أعِد/.test(b.textContent))?.click();
  await waitFor(() => appDoc()?.querySelector('.q-stage, .dots'), 25000);
  await driveGate(0);
  await waitFor(() => appDoc()?.querySelector('.celebrate'), 25000);
  endDoc = appDoc();
  ok(!!endDoc.querySelector('.celebrate') && !endDoc.querySelector('.celebrate--again'),
    '**وبإصابةٍ تامّة تُفتَح** (≥٨٠٪ من المحاولات)');
  ok(endDoc.body.textContent.includes(endGate.next),
    `🎓 **وبابُ «المستوى الثاني» يُذكَر في احتفالها** («${endGate.next}») — `
    + 'ذكرٌ لا عقدةَ له في الخريطة ولا مفتاحَ في ليتنر');
  const endStars = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}').stars
    || {};
  ok(endStars['gate:end'] > 0, 'ونجمةُ بوابة الختام مكتوبةٌ بمعرّفها هو');
  // **ومدَاها الرحلةُ كلُّها**: مفاتيحُ المحطات جميعِها من الجبهتين — يُقرأ من بيانها
  // هي (`gateSkills`) لا من عدّ ما وقع في محاولةٍ بعينها.
  const endScope = new Set(curriculum.gateSkills('end'));
  const outside = curriculum.stations()
    .flatMap((t) => t.skills || []).filter((k) => !endScope.has(k));
  ok(endScope.size > 0 && outside.length === 0,
    `ومدَاها الرحلةُ كلُّها — الجبهتان معاً (${endScope.size} مفتاحاً`
    + `${outside.length ? `، وخارجَها ${outside.length}` : ''})`);

  // ————— ١٩. **لا نصَّ يُنطَق خارج قائمة الصوت** (`AUDIO_QUEUE.md §٣`) —————
  //
  // النصُّ يُركَّب في زمن التشغيل («point to the big red ball»)، فلا يراه جردُ شجرةٍ
  // ولا يُمسَك إلا حيث يُنطَق. وبنكُ الصوت لم يُولَّد بعد، فالمطلوبُ اليومَ أن يكون
  // كلُّ منطوقٍ **مصفوفاً منتظِراً** — ويصير المطلوبُ غداً أن يكون له ملفّ، بلا تعديلٍ
  // في هذه الصفحة (يخدم `browser_test.py` القائمةَ على `/__queue.json`).

  const queued = await fetch('/__queue.json').then((r) => r.json()).catch(() => []);
  const inQueue = new Set(queued.map((text) => audio.keyFor(text)));
  const heard = [...new Set(timeline.filter((r) => r.t0 >= startedAt).map((r) => r.key))];
  const strays = heard.filter((key) => !inQueue.has(key));
  /* **والشاردُ يُسمّى لا يُعَدّ** (درسُ التقرير الذي يَعُدّ ولا يُسمّي، الجلسة ٥):
     مفتاحُ الملفّ **بصمةُ نصّه**، فلا يُقرأ منه النصّ. فيُطلَب من **جهتين**: نصُّه إن
     مرّ بمسار الاحتياط الآليّ، **وبصمتُه على كل حال** — فيُبحَث عنها في الشجرة.
     (وقد أمسك هذا البابُ عيباً حقيقياً في هذه الجلسة: نمذجةُ الصائت الأوسط كانت
     تنطق **اسمَ الحرف** لأنّ هدفَ جولتها رسمٌ لا كلمة.) */
  const strayText = [...new Set(spoken.map((row) => row.text))]
    .filter((text) => strays.includes(audio.keyFor(text)));
  ok(heard.length > 0 && strays.length === 0,
    `وكلُّ ما نطقته المحطةُ مصفوفٌ في قائمة الصوت (${heard.length} نصاً`
    + `، و${queued.length} في القائمة)`
    + (strays.length ? ` — خارجها ${strays.length}: «${strayText.join('» · «') || '؟'}»`
      + ` (بصماتُها: ${strays.join('، ')})` : ''));

  // ————— ٢٠. **نسخةُ القشرة تُرى** (`METHOD.md §١٢-١٠` — أمرُ المالك) —————
  //
  // يُقاس **الطرفان في متصفّحٍ حقيقيّ**: قشرةٌ حيّة تُسأل فتجيب من ثابتها، ولوحةُ
  // الوالد تعرض جوابَها. ولو أجابت القشرةُ ولم تعرض اللوحةُ لَما شهد ميدانٌ بشيء.

  const reg = await win.navigator.serviceWorker?.ready?.catch(() => null);
  const worker = reg && (reg.active || win.navigator.serviceWorker.controller);
  if (!worker) {
    ok(false, 'لم تُسجَّل قشرةُ العمل دون إنترنت في الفحص (فلا يُقاس جوابُها)');
  } else {
    const version = await new Promise((resolve) => {
      const channel = new MessageChannel();
      channel.port1.onmessage = (e) => resolve(e.data);
      worker.postMessage({ type: 'version' }, [channel.port2]);
      setTimeout(() => resolve(null), 4000);
    });
    ok(version?.type === 'version' && /^v\d+$/.test(String(version.version || '')),
      `والقشرةُ الحيّة تجيب بنسختها («${version?.version ?? 'لا جواب'}»)`);

    // **والبوابةُ تُفتَح مرّةً في الجلسة** (`parent.js`): فُتحت في الفحص ٩ أعلاه،
    // فيُقبَل الحالان — بوابةٌ تُجاب، أو لوحةٌ مفتوحةٌ سلفاً.
    win.location.hash = '#/parent';
    await waitFor(() => appDoc()?.querySelector('.gate .giant, .audit'));
    doc = appDoc();
    const q3 = doc.querySelector('.gate .giant');
    if (q3) {
      const [x, y] = q3.textContent.split('×').map((part) =>
        Number([...part.trim()].map((ch) => AR.indexOf(ch)).join('')));
      doc.querySelector('.gate input').value = String(x * y);
      doc.querySelector('.gate-go').click();
    }
    const shown = await waitFor(() => {
      const el = appDoc()?.querySelector('.sw-version-num');
      return el && el.textContent.trim() ? el : null;
    }, 8000);
    ok(!!shown && shown.textContent.trim() === String(version?.version),
      `ولوحةُ الوالد تعرض **نسخةَ ما يعمل** لا رقماً مكتوباً («${shown?.textContent.trim() ?? '—'}»)`);

    /* ————— ٢٠ب. 🔗 **كلُّ معروضٍ في اللوحة مقروءٌ من القياس** (معيارُ الجلسة ٨) —————

       اللوحةُ الآن **بعد الرحلة كلِّها** لا قبلها: فيها سجلٌّ حقيقيّ كتبه مساقٌ حيّ.
       فيُقابَل ما رُسم فيها **بحسابٍ مستقلّ** من سجلّ ليتنر في التخزين وحوضِ المنهج —
       لا برقمٍ يُكتب هنا ولا بنداء الدالّة التي رسمته. فلو حُسب في اللوحة بيدٍ أو
       قُرئ من غير القياس لَافترق العددان. */

    const panel = appDoc();
    // **وأوّلُ عددٍ في البطاقة هو المقصود** («٣٢ من ٥٦»): جمعُ محارف البطاقة كلِّها
    // يلصق العددين فيصير رقماً لا وجودَ له — عيبٌ يُقرأ حمرةً كاذبة على لوحةٍ سليمة.
    const arRead = (text) => Number([...(String(text).match(/[٠-٩]+/) || ['٠'])[0]]
      .map((ch) => AR.indexOf(ch)).join(''));
    const live = JSON.parse(win.localStorage.getItem('listen.progress.v1') || '{}').skills || {};
    const { MASTERED_BOX } = await import('/js/progress.js');
    const bank = curriculum.coupledWords();
    const heardWords = bank.filter((w) => (live[w.listen]?.box ?? -1) >= MASTERED_BOX);
    const readWords = heardWords.filter((w) => w.read.some((key) => live[key]));
    const cells = [...panel.querySelectorAll('.audit .coupling .pill b')].map((b) => arRead(b.textContent));
    ok(cells.length === 3 && cells[0] === heardWords.length && cells[1] === readWords.length
      && cells[2] === heardWords.length - readWords.length,
      `🔗 **وعدّادُ الاقتران عينُ ما في سجلّ ليتنر** (اللوحة: ${cells.join('/')} — `
      + `والحسابُ المستقلّ: ${heardWords.length}/${readWords.length}/`
      + `${heardWords.length - readWords.length} من ${bank.length} كلمة)`);

    const drawnGroups = [...panel.querySelectorAll('.audit .unit-group h4')]
      .map((head) => head.textContent);
    ok(drawnGroups.length === curriculum.UNIT_SECTIONS.length
      && curriculum.UNIT_SECTIONS.every((s) => drawnGroups.includes(s.title)),
      `وأقسامُ المهارة قسمان كما أعلن المنهج (${drawnGroups.join(' · ') || 'لا قسم'})`);
    const drawnUnits = [...panel.querySelectorAll('.audit .unit')].length;
    const liveUnits = new Set(Object.keys(live).map((key) => key.split('|')[0]));
    ok(drawnUnits === liveUnits.size,
      `وكلُّ وحدةٍ قِيست لها سطرُها ولا سطرَ لغيرها (${drawnUnits} سطراً `
      + `و${liveUnits.size} وحدةً في السجلّ)`);
  }

  // ————— ٢١. 🎨 **لا قاعدةَ تسقط صامتةً** (عيبُ الجلسة ١٠ المقيس) —————
  //
  // **العيبُ الذي وُلد منه هذا الباب**: حرفُ نقطةٍ واحدٌ سبق تعليقاً قبل
  // `.btn--primary` (‏`./* … */`)، فقرأ المتصفّحُ المقدّمةَ `. .btn--primary`
  // **فأسقط القاعدةَ كلَّها بصمت**. ونتيجتُه على الجهاز: **الزرُّ الرئيس يُرسَم
  // زرّاً عادياً** — «تَابِعْ» في المحطة، وأزرارُ البوابات الثلاث، **وزرُّ التثبيت
  // على الشاشة الرئيسة** — بلا التوتيّ ولا ثِقَل حرفه، فلا يقول للطفل «أنا ما يُكبَس».
  //
  // **ولم يمسكه حارس** لأنّ الحرّاسَ يسألون عن وجود عناصرَ وسلوكِها، **ولا يسأل
  // أحدٌ هل بلغتِ الأنماطُ ما كُتبت له**. والمقياسُ هنا **المتصفّحُ نفسُه**: تُقطَّع
  // ورقةُ الأنماط قواعدَ عليا، وتُعرَض كلُّ قاعدةٍ وحدَها على محلّلٍ نظيف — فما ردّ
  // صفراً **قاعدةٌ ساقطة** يُسمّى موضعُها. ولا ظنَّ في الحكم: هو الحكمُ الذي يقع
  // على الطفل حرفاً بحرف.
  {
    const css = await (await fetch('/css/app.css')).text();

    /** تقطيعُ الورقة قواعدَ عليا: يتخطّى التعليقاتِ والنصوصَ ويعدّ الأقواس. */
    const topRules = (text) => {
      const rules = [];
      let depth = 0, start = 0, i = 0;
      while (i < text.length) {
        const two = text.slice(i, i + 2);
        if (two === '/*') { const end = text.indexOf('*/', i + 2); i = end < 0 ? text.length : end + 2; continue; }
        const ch = text[i];
        if (ch === '"' || ch === "'") {
          i++;
          while (i < text.length && text[i] !== ch) i += (text[i] === '\\' ? 2 : 1);
          i++; continue;
        }
        if (ch === '{') depth++;
        else if (ch === '}') {
          depth--;
          if (depth === 0) { rules.push(text.slice(start, i + 1)); start = i + 1; }
        }
        i++;
      }
      return rules;
    };

    const dropped = [];
    for (const rule of topRules(css)) {
      const sheet = new CSSStyleSheet();
      try { sheet.replaceSync(rule); } catch { /* لا يرمي المحلّل — يُسقط بصمت */ }
      if (sheet.cssRules.length === 0) {
        const head = rule.slice(0, rule.indexOf('{')).trim().replace(/\s+/g, ' ');
        dropped.push(head.slice(0, 60) || rule.slice(0, 40));
      }
    }
    ok(dropped.length === 0,
      `🎨 **ولا قاعدةَ في ورقة الأنماط تسقط صامتةً** — كلُّ ما كُتب يبلغ الطفل`
      + (dropped.length ? ` (ساقطٌ: ${dropped.join(' · ')})` : ''));

    // **وبرهانُ الزرّ الرئيس بعينه**: القاعدةُ الساقطة كانت قاعدتَه، فيُقاس أثرُها
    // حيث يقع — لونٌ وثِقَلٌ يفترقان عن الزرّ العادي. (باباً يبقى ولو تبدّل اللون.)
    const doc2 = appDoc(), win2 = doc2.defaultView;
    const probe = doc2.createElement('div');
    probe.innerHTML = '<button class="btn btn--primary"></button><button class="btn"></button>';
    doc2.body.appendChild(probe);
    const [primary, plain] = probe.querySelectorAll('button');
    const bgP = win2.getComputedStyle(primary).backgroundColor;
    const bgN = win2.getComputedStyle(plain).backgroundColor;
    const wP = win2.getComputedStyle(primary).fontWeight;
    probe.remove();
    ok(bgP !== bgN && Number(wP) >= 600,
      `🎨 **والفعلُ الرئيس يُرى رئيساً** — أرضيتُه غيرُ أرضية العادي وحرفُه ثقيل `
      + `(${bgP} مقابل ${bgN} · ثِقَل ${wP})`);
  }

  ok(appErrors.length === 0,
    `ولم يقع في التطبيق خطأٌ ولا وعدٌ مرفوض طوالَ المساق (${appErrors.length})`
    + (appErrors.length ? ` — ${appErrors.slice(0, 3).join(' · ')}` : ''));

  } catch (err) {
    ok(false, `عطبٌ في صفحة الفحص: ${(err && (err.stack || err.message)) || err}`);
  }

  clearTimeout(watchdog);
  await report(out);
</script>
</body>
</html>
